# split: Split is a group expense splitter. Home lists my groups with my balance in each; a group screen shows who I am (picked from the members), the balances, a "Settle up" list of the fewest transfers that zero everyone, and the expenses with filters by member and category and an undo for the last delete. Expenses are added from a bottom sheet (description, amount, currency converted to USD with a live rate, category, who paid, and an equal / shares / exact split). The ledger (groups, expenses, transfers) lives on the backend in shared state so every member sees the same one; the selected group and who I am are local to the device. Calm, precise, money-app feel.
