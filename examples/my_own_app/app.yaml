# metacode: the root app, the my-own.app landing page. `state:` holds the
# initial state by scope (docs/STATE_ARCHITECTURE.md); its types are in
# app/models/state.yaml. `start:` runs when the app opens: the example chat
# plays (types the question, then the answer). The waitlist runs on the
# backend: `joinWaitlist` calls the remote action of the same name.
name: metacode
start: playExample
description: My Own App website, an AI-driven app where you build and use your own
  customized app in minutes.
version: 0.1.0
state:
  ephemeral:
    email: ''
    waitlistStatus: idle
    chatStage: 0
    buildStep: 0
    tweaking: false
    exampleIndex: 0
  local:
    idea: ''
    appKind: custom
    appColor: orange
    appPhotos: false
    appStreak: false
  remote:
    waitlistEmail: ''
  system:
    waitlist: []
  shared:
    waitlistCount: 1284
    config:
      astrology: false
