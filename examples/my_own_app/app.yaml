  appKind: custom
  buildStep: 0
  appColor: orange
  appPhotos: false
  appStreak: false
  tweaking: false
  email: ''
  waitlistStatus: invalid
  waitlistCount: 1284
  exampleIndex: 0
  chatStage: 0
