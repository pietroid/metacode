# colors: the palette, light and dark. Widgets use these names (`color: accent`).
# Look: My Own App. Calm near-black, one orange, Plus Jakarta Sans. The root
# names every token of the Metacode style (packages/app_ui/lib/style.dart).
colors:
  light:
    bg: '#FAFAF9'
    surface: '#FFFFFF'
    fill: '#F2F2F0'
    fillStrong: '#E7E7E4'
    line: '#E7E7E4'
    lineStrong: '#D4D4D0'
    ink: '#0A0A0A'
    ink2: '#5C5C59'
    ink3: '#9A9A96'
    primary: '#FF5A1F'
    onPrimary: '#FFFFFF'
    accent: '#E8490F'
    onAccent: '#FFFFFF'
    success: '#16A36A'
    warning: '#B86E0A'
    danger: '#D23B2F'
    info: '#3B6797'
  dark:
    bg: '#0A0A0A'
    surface: '#121212'
    fill: '#181818'
    fillStrong: '#222222'
    line: '#222222'
    lineStrong: '#2E2E2E'
    ink: '#F5F5F4'
    ink2: '#A3A3A0'
    ink3: '#6B6B68'
    primary: '#FF5A1F'
    onPrimary: '#FFFFFF'
    accent: '#FF7A45'
    onAccent: '#0A0A0A'
