# FoodLivePage: the `foodLive` route, the food example on its own page to try
# it: a LiveFrame in food's own colors around the live `module: food`, with a
# start over button that resets it (resetFood).
FoodLivePage:
  LiveFrame:
    icon: restaurant
    title: foodLive
    reset: resetFood
    screen: '#F4FAF5'
    ink: '#0F2416'
    child:
      module:
        name: food
        contained: true
