# FoodLivePage: the `foodLive` route, the food example on its own page to try
# it: an app bar (a small icon tile and its name, compact like the landing
# page's Logo, and a home button back to the landing page) over a
# PhoneFrame in food's own colors around the live `module: food`, centered;
# it scrolls when the screen is shorter than the phone.
FoodLivePage:
  scaffold:
    appBar:
      title:
        row:
          spacing: 10
          crossAxisAlignment: center
          children:
          - container:
              width: 28
              height: 28
              radius: 8
              color: fill
              child:
                center:
                  icon:
                    name: restaurant
                    size: 16
                    color: accent
          - text:
              value: foodLive
              maxLines: 1
              style:
                variant: labelLarge
                fontWeight: w700
      actions:
      - padding:
          right: 8
          child:
            iconButton:
              icon: home
              tooltip: backHome
              onPressed: goHome
    body:
      center:
        scroll:
          padding:
            horizontal: 16
            vertical: 24
            child:
              PhoneFrame:
                height: 720
                screen: '#F4FAF5'
                ink: '#0F2416'
                child:
                  module:
                    name: food
                    contained: true
