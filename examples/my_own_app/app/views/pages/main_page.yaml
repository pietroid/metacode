# MainPage: the landing page. An app bar (Logo, LanguagePicker, join
# button) over one scrolling column of sections: Hero, HowItWorks,
# WaitlistSection, Footer (the Studio "try it" section is
# out for now). Sections cap at 1120 wide and center.
MainPage:
  scaffold:
    appBar:
      title: Logo
      actions:
      - LanguagePicker
      - sizedBox:
          width: 8
      - padding:
          right: 16
          child:
            outlinedButton:
              text: joinWaitlistText
              onPressed: openWaitlist
    body:
      scroll:
        column:
          crossAxisAlignment: stretch
          children:
          - Hero
          - HowItWorks
          - WaitlistSection
          - Footer
