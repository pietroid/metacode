# MainPage: the landing page. An app bar (Logo, LanguagePicker, join
# button) over one
# scrolling column of sections: Hero, Examples, HowItWorks, Ideas,
# WaitlistSection, Footer. Sections cap at 1120 wide and center.
MainPage:
  scaffold:
    appBar:
      title: Logo
      actions:
      - LanguagePicker
      - sizedBox:
          width: 8
      - padding:
          right: 16
          child:
            outlinedButton:
              text: joinWaitlistText
              onPressed: openWaitlist
    body:
      scroll:
        column:
          crossAxisAlignment: stretch
          children:
          - Hero
          - Examples
          - HowItWorks
          - Ideas
          - WaitlistSection
          - Footer
