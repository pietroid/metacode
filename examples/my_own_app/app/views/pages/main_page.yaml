# MainPage: the landing page. An app bar (Logo, join button) over one
# scrolling column of sections: Hero, Ticker, Examples, HowItWorks, Ideas,
# WaitlistSection, Footer. Sections cap at 1120 wide and center.
MainPage:
  scaffold:
    appBar:
      title: Logo
      actions:
      - padding:
          right: 16
          child:
            outlinedButton:
              text: joinWaitlistText
              onPressed: openWaitlist
    body:
      scroll:
        column:
          crossAxisAlignment: stretch
          children:
          - Hero
          - Ticker
          - Examples
          - HowItWorks
          - Ideas
          - WaitlistSection
          - Footer
