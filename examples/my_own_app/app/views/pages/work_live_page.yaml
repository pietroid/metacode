# WorkLivePage: the `workLive` route, the work example on its own page to try
# it: a LiveFrame in work's own colors around the live `miniApp: work`, with a
# start over button that resets it (resetWork).
WorkLivePage:
  LiveFrame:
    icon: work
    title: workLive
    reset: resetWork
    screen: '#EDF1F6'
    ink: '#18181B'
    child:
      miniApp: work
