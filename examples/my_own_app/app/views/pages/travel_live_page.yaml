# TravelLivePage: the `travelLive` route, the travel example on its own page to try
# it: a LiveFrame in travel's own colors around the live `miniApp: travel`, with a
# start over button that resets it (resetTravel).
TravelLivePage:
  LiveFrame:
    icon: flight
    title: travelLive
    reset: resetTravel
    screen: '#FBF5EC'
    ink: '#2B1E16'
    child:
      miniApp: travel
