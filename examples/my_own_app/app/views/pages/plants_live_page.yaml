# PlantsLivePage: the `plantsLive` route, the plants example on its own page to try
# it: an app bar (a small icon tile and its name, compact like the landing
# page's Logo, and a home button back to the landing page) over a
# phone frame (dark bezel, PhoneStatusBar, the live `module: plants`, home
# indicator), centered; it scrolls when the screen is shorter than the phone.
PlantsLivePage:
  scaffold:
    appBar:
      title:
        row:
          spacing: 10
          crossAxisAlignment: center
          children:
          - container:
              width: 28
              height: 28
              radius: 8
              color: fill
              child:
                center:
                  icon:
                    name: pottedPlant
                    size: 16
                    color: accent
          - text:
              value: plantsLive
              maxLines: 1
              style:
                variant: labelLarge
                fontWeight: w700
      actions:
      - padding:
          right: 8
          child:
            iconButton:
              icon: home
              tooltip: backHome
              onPressed: goHome
    body:
      center:
        scroll:
          padding:
            horizontal: 16
            vertical: 24
            child:
              container:
                maxWidth: 340
                height: 720
                color: '#161616'
                radius: 54
                padding: 10
                child:
                  container:
                    color: surface
                    radius: 44
                    child:
                      column:
                        crossAxisAlignment: stretch
                        children:
                        - PhoneStatusBar
                        - expanded:
                            module:
                              name: plants
                              contained: true
                        - sizedBox:
                            height: 28
                            child:
                              center:
                                container:
                                  width: 120
                                  height: 5
                                  radius: 3
                                  color: ink
