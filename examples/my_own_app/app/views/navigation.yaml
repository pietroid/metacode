# navigation: the app's routes. `initial` opens at start; actions open the
# others with core.navigator.push(Routes.<name>) and close the top one with
# core.navigator.pop().
initial: home
routes:
  home: MainPage
  waitlist: {dialog: WaitlistDialog}
  foodLive: FoodLivePage
  musicLive: MusicLivePage
  workLive: WorkLivePage
  plantsLive: PlantsLivePage
