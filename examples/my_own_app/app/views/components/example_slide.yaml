# ExampleSlide: one carousel slide: ExampleCopy beside ExamplePhone (stacked
# under 860 wide).
ExampleSlide:
  responsive:
    breakpoint: 860
    narrow:
      column:
        crossAxisAlignment: stretch
        spacing: 32
        children:
        - ExampleCopy
        - ExamplePhone
    wide:
      row:
        crossAxisAlignment: center
        spacing: 64
        children:
        - expanded: ExampleCopy
        - sizedBox:
            width: 400
            child: ExamplePhone
