# ExampleSlide: the examples layout: ExampleCopy on the left, ExamplePhone on
# the right (stacked, phone below, under 860 wide).
ExampleSlide:
  responsive:
    breakpoint: 860
    narrow:
      column:
        crossAxisAlignment: stretch
        spacing: 56
        children:
        - ExampleCopy
        - ExamplePhone
    wide:
      row:
        crossAxisAlignment: center
        spacing: 96
        children:
        - expanded: ExampleCopy
        - sizedBox:
            width: 360
            child: ExamplePhone
