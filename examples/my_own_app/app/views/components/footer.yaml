# Footer: the page footer: logo, name and copyright.
Footer:
  column:
    crossAxisAlignment: stretch
    children:
    - divider:
        height: 1
    - container:
        maxWidth: 1120
        padding:
          horizontal: 24
          top: 32
          bottom: 48
        child:
          row:
            children:
            - row:
                spacing: 10
                children:
                - image:
                    src: examples/my_own_app/app/views/style/images/logo.svg
                    width: 11
                    height: 16
                - text:
                    value: myOwnApp
                    style:
                      variant: labelSmall
                      color: ink3
            - spacer: {}
            - text:
                value: copyright
                style:
                  variant: bodySmall
                  color: ink3
