# Footer: the page footer: the logo and the copyright.
Footer:
  column:
    crossAxisAlignment: stretch
    children:
    - divider:
        height: 1
    - container:
        maxWidth: 1120
        padding:
          horizontal: 24
          top: 32
          bottom: 48
        child:
          row:
            children:
            - image:
                src: examples/my_own_app/app/views/style/images/my_own_app_logo.svg
                width: 92
                height: 32
            - spacer: {}
            - text:
                value: copyright
                style:
                  variant: bodySmall
                  color: ink3
