# Step4: demo build step 4, "Putting it on your phone", with its
# done/doing/todo indicator.
Step4:
  row:
    spacing: 12
    children:
    - match:
        value: step4State
        cases:
          done: StepDone
          doing: StepDoing
        default: StepTodo
    - expanded:
        text:
          value: puttingItOnYour
          style:
            variant: bodyMedium
