# IdeaChips: preset idea chips in StudioPanel; tapping one fills the idea
# and makes the app.
IdeaChips:
  wrap:
    spacing: 8
    runSpacing: 8
    children:
    - choiceChip:
        label: waterMyPlants
        selected: ideaIsPlants
        onSelected: pickPlants
    - choiceChip:
        label: trackMyDailyHabits
        selected: ideaIsHabits
        onSelected: pickHabits
    - choiceChip:
        label: planMealsForThe
        selected: ideaIsMeals
        onSelected: pickMeals
    - choiceChip:
        label: splitBillsWithRoommates
        selected: ideaIsBills
        onSelected: pickBills
