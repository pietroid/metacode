# Ideas: the ideas section: headline and four use-case cards (UseHome,
# UseHealth, UseWork, UseHobbies).
Ideas:
  container:
    maxWidth: 1120
    padding:
      horizontal: 24
      top: 128
    child:
      column:
        crossAxisAlignment: stretch
        spacing: 16
        children:
        - text:
            value: ideas
            style:
              variant: labelSmall
              color: accent
        - text:
            value: whateverYouNeedIt
            style:
              variant: headlineLarge
        - sizedBox:
            height: 32
        - wrap:
            alignment: center
            spacing: 16
            runSpacing: 16
            children:
            - UseHome
            - UseHealth
            - UseWork
            - UseHobbies
