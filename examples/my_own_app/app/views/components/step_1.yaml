# Step1: demo build step 1, "Understanding what you need", with its
# done/doing/todo indicator.
Step1:
  row:
    spacing: 12
    children:
    - match:
        value: step1State
        cases:
          done: StepDone
          doing: StepDoing
        default: StepTodo
    - expanded:
        text:
          value: understandingWhatYouNeed
          style:
            variant: bodyMedium
