# Step3: demo build step 3, "Setting up your lists and reminders", with its
# done/doing/todo indicator.
Step3:
  row:
    spacing: 12
    children:
    - match:
        value: step3State
        cases:
          done: StepDone
          doing: StepDoing
        default: StepTodo
    - expanded:
        text:
          value: settingUpYourLists
          style:
            variant: bodyMedium
