# HowStep1: how it works, step 1: "Tell your problem", its number, title and text on a card.
HowStep1:
  container:
    color: surface
    borderColor: line
    radius: 24
    padding:
      horizontal: 24
      top: 28
      bottom: 28
    child:
      column:
        crossAxisAlignment: start
        spacing: 10
        children:
        - text:
            value: '01'
            style:
              variant: labelMedium
              color: primary
        - text:
            value: tellYourProblem
            style:
              variant: titleLarge
        - text:
            value: tellYourProblemBody
            style:
              variant: bodyMedium
              color: ink2
