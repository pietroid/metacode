# Step2: demo build step 2, "Designing your screens", with its
# done/doing/todo indicator.
Step2:
  row:
    spacing: 12
    children:
    - match:
        value: step2State
        cases:
          done: StepDone
          doing: StepDoing
        default: StepTodo
    - expanded:
        text:
          value: designingYourScreens
          style:
            variant: bodyMedium
