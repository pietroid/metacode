# HowItWorks: the "How it works" section: HowHeading over three cards
# (HowStep1-3) in a row (stacked under 860 wide).
HowItWorks:
  container:
    maxWidth: 1120
    padding:
      horizontal: 24
      top: 144
    child:
      column:
        crossAxisAlignment: stretch
        spacing: 56
        children:
        - HowHeading
        - responsive:
            breakpoint: 860
            narrow:
              column:
                crossAxisAlignment: stretch
                spacing: 16
                children:
                - HowStep1
                - HowStep2
                - HowStep3
            wide:
              row:
                crossAxisAlignment: start
                spacing: 16
                children:
                - expanded: HowStep1
                - expanded: HowStep2
                - expanded: HowStep3
