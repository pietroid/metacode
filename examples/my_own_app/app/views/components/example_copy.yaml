# ExampleCopy: the text side of an example slide: tag, prompt, blurb and the
# "make one like this" button.
ExampleCopy:
  column:
    crossAxisAlignment: start
    spacing: 14
    children:
    - text:
        value: exampleTag
        style:
          variant: labelSmall
          color: ink3
    - text:
        value: examplePrompt
        style:
          variant: headlineMedium
    - text:
        value: exampleBlurb
        style:
          variant: bodyLarge
          color: ink2
    - sizedBox:
        height: 8
    - row:
        spacing: 16
        children:
        - filledButton:
            text: makeOneLikeThis
            onPressed: makeLikeThis
        - text:
            value: examplePosition
            style:
              variant: bodySmall
              color: ink3
