# ExampleCopy: the text side of the examples: heading, CarouselNav chips, the
# current prompt and blurb, and the "make one like this" button.
ExampleCopy:
  column:
    crossAxisAlignment: start
    children:
    - text:
        value: examples
        style:
          variant: labelSmall
          color: accent
    - sizedBox:
        height: 16
    - text:
        value: oneSentenceOneApp
        style:
          variant: headlineLarge
    - sizedBox:
        height: 16
    - text:
        value: eachOfTheseStarted
        style:
          variant: bodyLarge
          color: ink2
    - sizedBox:
        height: 40
    - CarouselNav
    - sizedBox:
        height: 40
    - text:
        value: examplePrompt
        style:
          variant: headlineMedium
    - sizedBox:
        height: 12
    - text:
        value: exampleBlurb
        style:
          variant: bodyLarge
          color: ink2
    - sizedBox:
        height: 32
    - filledButton:
        text: makeOneLikeThis
        onPressed: makeLikeThis
