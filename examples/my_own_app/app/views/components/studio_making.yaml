  padding:
    horizontal: 20
    top: 8
    bottom: 20
    child:
      column:
        crossAxisAlignment: stretch
        spacing: 14
        children:
        - row:
            children:
            - container:
                width: 60
                height: 12
                radius: 6
                color: fill
        - row:
            children:
            - container:
                width: 170
                height: 28
                radius: 8
                color: fill
        - container:
            height: 120
            radius: 20
            color: fill
        - container:
            height: 52
            radius: 14
            color: fill
        - container:
            height: 52
            radius: 14
            color: fill
        - container:
            height: 52
            radius: 14
            color: fill
        - sizedBox:
            height: 8
        - progress: {}
