# WaitlistInline: the inline email field and join button in WaitlistSection.
WaitlistInline:
  column:
    crossAxisAlignment: stretch
    spacing: 10
    children:
    - textField:
        value: emailValue
        hint: youExampleCom
        onChanged: updateEmail
        onSubmitted: joinWaitlist
    - if:
        condition: waitlistInvalid
        then:
          text:
            value: thatEmailDoesntLook
            style:
              variant: bodySmall
              color: danger
    - if:
        condition: waitlistFailed
        then:
          text:
            value: couldNotJoin
            style:
              variant: bodySmall
              color: danger
    - filledButton:
        text: joinButtonText
        onPressed: joinWaitlist
