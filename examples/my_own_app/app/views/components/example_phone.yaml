# ExamplePhone: a phone with the current example living inside: a
# PhoneFrame around ExampleScreen, in the colors of the example's module
# (picked by exampleKey), so its screen matches the module's theme.
ExamplePhone:
  match:
    value: exampleKey
    cases:
      food:
        PhoneFrame:
          height: 720
          screen: '#F4FAF5'
          ink: '#0F2416'
          child: ExampleScreen
      work:
        PhoneFrame:
          height: 720
          screen: '#EDF1F6'
          ink: '#18181B'
          child: ExampleScreen
      travel:
        PhoneFrame:
          height: 720
          screen: '#FBF5EC'
          ink: '#2B1E16'
          child: ExampleScreen
