# ExamplePhone: a phone with the current example living inside: a dark bezel
# (no border) around a rounded screen with PhoneStatusBar, ExampleScreen
# (scrolls) and a home indicator. 340 wide at most, centered.
ExamplePhone:
  container:
    maxWidth: 340
    height: 720
    color: '#161616'
    radius: 54
    padding: 10
    child:
      container:
        color: surface
        radius: 44
        child:
          column:
            crossAxisAlignment: stretch
            children:
            - PhoneStatusBar
            - expanded:
                scroll: ExampleScreen
            - sizedBox:
                height: 28
                child:
                  center:
                    container:
                      width: 120
                      height: 5
                      radius: 3
                      color: ink
