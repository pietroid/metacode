# WaitlistDone: the waitlist confirmation: "You're on the list" and a Done
# button that closes the sheet.
WaitlistDone:
  column:
    crossAxisAlignment: stretch
    spacing: 12
    children:
    - icon:
        name: checkCircle
        size: 40
        color: success
    - text:
        value: youreOnTheList
        style:
          variant: headlineSmall
        align: center
    - text:
        value: joinedText
        style:
          variant: bodyMedium
          color: ink2
        align: center
    - filledButton:
        text: done
        onPressed: close
