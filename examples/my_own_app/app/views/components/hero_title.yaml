# HeroTitle: the headline "Say what you need. Get your own app.", sized by
# screen width.
HeroTitle:
  responsive:
    breakpoint: 760
    narrow:
      text:
        spans:
        - sayWhatYouNeed
        - value: ownApp
          style:
            color: primary
        style:
          variant: displayMedium
    wide:
      text:
        spans:
        - sayWhatYouNeed
        - value: ownApp
          style:
            color: primary
        style:
          variant: displayLarge
