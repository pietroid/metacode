# Hero: title, the live "make my app" demo and the idea chips.
HeroTitle:
  responsive:
    breakpoint: 760
    narrow:
      text:
        spans:
        - sayWhatYouNeed
        - value: ownApp
          style:
            color: primary
        style:
          variant: displayMedium
        align: center
