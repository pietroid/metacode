# HeroTitle: the headline "Say what you need. Get your own app.", sized by
# screen width.
HeroTitle:
  responsive:
    breakpoint: 760
    narrow:
      text:
        spans:
        - sayWhatYouNeed
        - value: ownApp
          style:
            color: primary
        style:
          variant: displayMedium
        align: center
    wide:
      container:
        maxWidth: 820
        child:
          text:
            spans:
            - sayWhatYouNeed
            - value: ownApp
              style:
                color: primary
            style:
              variant: displayLarge
            align: center
