# Hero: the top section: HeroCopy (headline, call to action and the example
# carousel) beside HeroPhone (the live example), both pinned to the top, so
# a taller or shorter example card never moves the rest. Stacked, phone
# below, under 900 wide.
Hero:
  container:
    maxWidth: 1120
    padding:
      horizontal: 24
      top: 64
      bottom: 16
    child:
      responsive:
        breakpoint: 900
        narrow:
          column:
            crossAxisAlignment: stretch
            spacing: 56
            children:
            - HeroCopy
            - ExamplePhone
        wide:
          row:
            crossAxisAlignment: start
            spacing: 72
            children:
            - expanded: HeroCopy
            - HeroPhone
