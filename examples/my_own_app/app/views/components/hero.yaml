# Hero: the top section: HeroCopy (headline, call to action and the example
# carousel) beside HeroPhone (the live example). Stacked, phone below, under
# 900 wide.
Hero:
  container:
    maxWidth: 1120
    padding:
      horizontal: 24
      top: 64
      bottom: 16
    child:
      responsive:
        breakpoint: 900
        narrow:
          column:
            crossAxisAlignment: stretch
            spacing: 56
            children:
            - HeroCopy
            - ExamplePhone
        wide:
          row:
            crossAxisAlignment: center
            spacing: 72
            children:
            - expanded: HeroCopy
            - HeroPhone
