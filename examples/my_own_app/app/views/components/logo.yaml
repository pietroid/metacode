# Logo: the app bar logo: the mark and "My Own App". Where the app bar is
# too narrow for both (a phone, with the LanguagePicker and the join
# button), just the mark.
Logo:
  responsive:
    breakpoint: 130
    narrow: LogoMark
    wide:
      row:
        spacing: 12
        children:
        - LogoMark
        - text:
            value: myOwnApp
            style:
              variant: labelLarge
              fontWeight: w800
