# ExampleScreen: what ExamplePhone shows: the current example's photo and its
# live module (`module: food|music|work|plants`, picked by exampleKey), both
# on the same 20px screen margin.
ExampleScreen:
  padding:
    horizontal: 20
    top: 4
    bottom: 20
    child:
      column:
        crossAxisAlignment: stretch
        spacing: 20
        children:
        - image:
            src: exampleImage
            height: 190
            fit: cover
            radius: 20
        - match:
            value: exampleKey
            cases:
              food:
                module: food
              music:
                module: music
              work:
                module: work
              plants:
                module: plants
