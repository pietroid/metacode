# ExampleScreen: what ExamplePhone shows: the current example's live module
# (`module: food|work|travel`, picked by exampleKey), contained: it scrolls
# on its own and its routes open inside the phone.
ExampleScreen:
  match:
    value: exampleKey
    cases:
      food:
        module:
          name: food
          contained: true
      work:
        module:
          name: work
          contained: true
      travel:
        module:
          name: travel
          contained: true
