# ExampleScreen: what ExamplePhone shows: the current example's live module
# (`miniApp: food|work|travel|astral`, picked by exampleKey), contained: it scrolls
# on its own and its routes open inside the phone.
ExampleScreen:
  match:
    value: exampleKey
    cases:
      food:
        miniApp: food
      work:
        miniApp: work
      travel:
        miniApp: travel
      astral:
        miniApp: astral
