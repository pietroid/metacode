# ExampleScreen: what ExamplePhone shows: the current example's photo on the
# 20px screen margin (music and plants only: food and work show as on their own page), over its live module (`module: food|music|work|plants`,
# picked by exampleKey), contained: it scrolls on its own and its routes open
# inside the phone.
ExampleScreen:
  column:
    crossAxisAlignment: stretch
    children:
    - if:
        condition: exampleHasPhoto
        then:
          padding:
            horizontal: 20
            top: 4
            bottom: 16
            child:
              image:
                src: exampleImage
                height: 190
                fit: cover
                radius: 20
    - expanded:
        match:
          value: exampleKey
          cases:
            food:
              module:
                name: food
                contained: true
            music:
              module:
                name: music
                contained: true
            work:
              module:
                name: work
                contained: true
            plants:
              module:
                name: plants
                contained: true
