# HeroCopy: the text side of the hero, left-aligned, with generous gaps
# between levels: HeroTitle, the questions, the subtitle
# (each its own paragraph), the tagline, then the example
# carousel: CarouselNav (the selector) over ExampleChat (what the visitor
# asked and what the assistant answered, in a card).
HeroCopy:
  column:
    crossAxisAlignment: start
    children:
    - HeroTitle
    - sizedBox:
        height: 36
    - container:
        maxWidth: 560
        child:
          column:
            crossAxisAlignment: start
            spacing: 20
            children:
            - text:
                value: heroQuestions
                style:
                  variant: bodyLarge
                  color: ink2
            - text:
                value: heroSubtitle
                style:
                  variant: bodyLarge
                  color: ink2
            - text:
                value: heroTagline
                style:
                  variant: titleMedium
    - sizedBox:
        height: 80
    - CarouselNav
    - sizedBox:
        height: 24
    - ExampleChat
