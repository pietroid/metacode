# CarouselNav: previous/next arrows and one chip per example (food, music,
# work, plants) that steer the examples carousel.
CarouselNav:
  row:
    spacing: 8
    children:
    - iconButton:
        icon: chevronLeft
        tooltip: previous
        onPressed: previousExample
    - expanded:
        wrap:
          alignment: center
          spacing: 8
          runSpacing: 8
          children:
          - choiceChip:
              label: food
              selected: exampleIsFood
              onSelected: showFood
          - choiceChip:
              label: music
              selected: exampleIsMusic
              onSelected: showMusic
          - choiceChip:
              label: work
              selected: exampleIsWork
              onSelected: showWork
          - choiceChip:
              label: plants
              selected: exampleIsPlants
              onSelected: showPlants
    - iconButton:
        icon: chevronRight
        tooltip: next
        onPressed: nextExample
