# CarouselNav: the example selector: one ExampleChip per example (food,
# work, travel, astral) that picks the example shown in the phone. The astral
# chip shows only when the astrology toggle is on (astrologyEnabled).
CarouselNav:
  wrap:
    spacing: 10
    runSpacing: 10
    children:
    - ExampleChip: {index: 0, label: food}
    - ExampleChip: {index: 1, label: work}
    - ExampleChip: {index: 2, label: travel}
    - if:
        condition: astrologyEnabled
        then: {ExampleChip: {index: 3, label: astral}}
