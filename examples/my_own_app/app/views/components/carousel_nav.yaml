# CarouselNav: one chip per example (food, work, travel) that picks the
# example shown in the phone, with previous/next arrows at the end.
CarouselNav:
  row:
    crossAxisAlignment: center
    children:
    - expanded:
        wrap:
          spacing: 8
          runSpacing: 8
          children:
          - choiceChip:
              label: food
              selected: exampleIsFood
              onSelected: showFood
          - choiceChip:
              label: work
              selected: exampleIsWork
              onSelected: showWork
          - choiceChip:
              label: travel
              selected: exampleIsTravel
              onSelected: showTravel
    - iconButton:
        icon: chevronLeft
        tooltip: previous
        onPressed: previousExample
    - iconButton:
        icon: chevronRight
        tooltip: next
        onPressed: nextExample
