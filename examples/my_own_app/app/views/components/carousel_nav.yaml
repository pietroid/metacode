# Examples: a carousel of four working mini apps. Each slide embeds a
# sub-app from apps/ (food, music, work, plants) with `app:`.
CarouselNav:
  row:
    spacing: 8
    children:
    - iconButton:
        icon: chevronLeft
        tooltip: previous
        onPressed: previousExample
    - expanded:
        wrap:
          alignment: center
          spacing: 8
          runSpacing: 8
          children:
          - choiceChip:
              label: food
              selected: exampleIsFood
              onSelected: showFood
          - choiceChip:
              label: music
              selected: exampleIsMusic
              onSelected: showMusic
          - choiceChip:
              label: work
              selected: exampleIsWork
              onSelected: showWork
          - choiceChip:
              label: plants
              selected: exampleIsPlants
              onSelected: showPlants
    - iconButton:
        icon: chevronRight
        tooltip: next
        onPressed: nextExample
