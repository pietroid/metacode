# CarouselNav: the example selector: one ExampleChip per example (food,
# work, travel) that picks the example shown in the phone.
CarouselNav:
  wrap:
    spacing: 10
    runSpacing: 10
    children:
    - ExampleChip: {index: 0, label: food}
    - ExampleChip: {index: 1, label: work}
    - ExampleChip: {index: 2, label: travel}
