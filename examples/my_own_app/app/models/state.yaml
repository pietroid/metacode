# state: the app's state (the reserved model); initial values in app.yaml.
#
# Primitives: string, boolean, number, datetime. Lists: list(type).
# Optional fields end with `?`. A list of values declares an enum.
state:
  idea: string
  appKind: appKind
  buildStep: number
  appColor: appColor
  appPhotos: boolean
  appStreak: boolean
  tweaking: boolean
  email: string
  waitlistStatus: waitlistStatus
  waitlistCount: number
  exampleIndex: number
  chatStage: number
