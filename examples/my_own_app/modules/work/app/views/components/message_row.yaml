# MessageRow: one inbox row under a RowDivider: initials, sender, time, an
# unread dot and the subject. Tapping it marks it read.
MessageRow:
  column:
    crossAxisAlignment: stretch
    children:
    - RowDivider
    - tappable:
        onTap: markRead
        child:
          padding:
            vertical: 10
            child:
              row:
                spacing: 12
                children:
                - avatar: {text: messageInitials, radius: 18, color: fill}
                - expanded:
                    column:
                      crossAxisAlignment: start
                      spacing: 1
                      children:
                      - row:
                          spacing: 8
                          children:
                          - expanded:
                              if:
                                condition: messageUnread
                                then: {text: {value: messageSender, maxLines: 1, style: {variant: titleSmall, fontWeight: w600}}}
                                else: {text: {value: messageSender, maxLines: 1, style: {variant: titleSmall, color: ink2}}}
                          - text: {value: messageTime, style: {variant: bodySmall, color: ink3}}
                          - if:
                              condition: messageUnread
                              then: {container: {width: 6, height: 6, radius: 3, color: accent}}
                              else: {sizedBox: {width: 6}}
                      - text: {value: messageSubject, maxLines: 1, style: {variant: bodySmall, color: ink2}}
