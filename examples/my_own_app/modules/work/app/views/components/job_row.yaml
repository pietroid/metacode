# JobRow: one list row, a job: paid checkbox, client, task and amount.
JobRow:
  padding:
    vertical: 2
    child:
      row:
        spacing: 8
        children:
        - checkbox:
            value: jobPaid
            onChanged: toggleJobPaid
        - expanded:
            column:
              crossAxisAlignment: start
              children:
              - text:
                  value: jobClient
                  style:
                    variant: titleSmall
              - text:
                  value: jobTask
                  style:
                    variant: bodySmall
                    color: ink3
        - text:
            value: jobAmount
            style:
              variant: labelLarge
              color: ink2
