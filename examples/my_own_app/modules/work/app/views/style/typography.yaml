# typography: the text variants (size, weight, family, spacing).
# Look: quiet and businesslike. Inter, graphite ink on a neutral page, one
# muted slate accent, small radii, regular icons. Keys left out are inherited.
typography:
  headlineSmall:
    font: display
    size: 24
    weight: 600
    height: 1.2
    tracking: -0.02
  titleLarge:
    font: display
    size: 17
    weight: 600
    height: 1.3
    tracking: -0.01
  titleSmall:
    font: text
    size: 14
    weight: 500
    height: 1.35
    tracking: 0
