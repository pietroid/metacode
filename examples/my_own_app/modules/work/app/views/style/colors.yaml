# colors: the palette, light and dark. Widgets use these names (`color: accent`).
# Look: quiet and businesslike. Inter, graphite ink on a faintly blue page, one
# muted slate accent, small radii, regular icons. Keys left out are inherited.
colors:
  light:
    bg: '#EDF1F6'
    surface: '#FFFFFF'
    fill: '#E6EBF2'
    fillStrong: '#D8DFE9'
    line: '#E2E7EE'
    lineStrong: '#C9D1DC'
    ink: '#18181B'
    ink2: '#52525B'
    ink3: '#8E8E95'
    primary: '#27272A'
    onPrimary: '#FFFFFF'
    accent: '#3F5A7A'
    onAccent: '#FFFFFF'
    success: '#3F6B4F'
    warning: '#8A6A2F'
    danger: '#9F3A38'
    info: '#3F5A7A'
  dark:
    bg: '#111113'
    surface: '#18181B'
    fill: '#1F1F23'
    fillStrong: '#2A2A2F'
    line: '#26262B'
    lineStrong: '#3A3A40'
    ink: '#EDEDEF'
    ink2: '#A1A1AA'
    ink3: '#6B6B74'
    primary: '#E4E4E7'
    onPrimary: '#18181B'
    accent: '#8FA6C2'
    onAccent: '#111113'
    success: '#7FA88C'
    warning: '#C9A86A'
    danger: '#D08583'
    info: '#8FA6C2'
