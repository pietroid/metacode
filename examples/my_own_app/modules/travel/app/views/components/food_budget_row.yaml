# FoodBudgetRow: the selected day's food budget on a white card: a sunny
# tile, "Food budget", its amount and a plus; tapping it opens the budget sheet.
FoodBudgetRow:
  tappable:
    onTap: openBudget
    child:
      container:
        color: surface
        radius: 18
        padding: {horizontal: 14, vertical: 12}
        child:
          row:
            spacing: 12
            children:
            - container:
                width: 34
                height: 34
                radius: 12
                color: fill
                child: {center: {icon: {name: restaurant, size: 17, color: warning}}}
            - expanded:
                column:
                  crossAxisAlignment: start
                  spacing: 1
                  children:
                  - text: {value: foodBudget, maxLines: 1, style: {variant: titleSmall}}
                  - text: {value: foodBudgetHint, maxLines: 1, style: {variant: bodySmall, color: ink2}}
            - text: {value: foodBudgetAmount, style: {variant: titleSmall}}
            - icon: {name: plusCircle, size: 20, color: primary}
