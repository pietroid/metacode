# BudgetSheet: the `budget` bottom sheet, the selected day's food budget: the
# day and a close button, the amount and the day's total, quick amounts that
# add at once (+€10, +€20, +€50), a custom amount with its add button, and Done.
BudgetSheet:
  padding:
    horizontal: 20
    top: 8
    bottom: 24
    child:
      column:
        crossAxisAlignment: stretch
        spacing: 14
        children:
        - row:
            children:
            - expanded:
                column:
                  crossAxisAlignment: start
                  spacing: 2
                  children:
                  - text: {value: foodBudget, style: {variant: labelMedium, color: ink3}}
                  - text: {value: dayHeading, maxLines: 1, style: {variant: titleLarge}}
            - iconButton: {icon: close, tooltip: close, onPressed: goBack}
        - container:
            color: fill
            radius: 20
            padding: 16
            child:
              row:
                spacing: 12
                children:
                - container:
                    width: 44
                    height: 44
                    radius: 22
                    color: surface
                    child: {center: {icon: {name: restaurant, size: 20, color: warning}}}
                - expanded:
                    column:
                      crossAxisAlignment: start
                      spacing: 2
                      children:
                      - text: {value: foodBudgetAmount, style: {variant: headlineSmall}}
                      - text: {value: dayTotalText, maxLines: 1, style: {variant: bodySmall, color: ink2}}
        - text: {value: quickAdd, style: {variant: labelMedium, color: ink3}}
        - row:
            spacing: 8
            children:
            - expanded: {outlinedButton: {text: plus10, onPressed: addFood10}}
            - expanded: {outlinedButton: {text: plus20, onPressed: addFood20}}
            - expanded: {outlinedButton: {text: plus50, onPressed: addFood50}}
        - text: {value: customAmount, style: {variant: labelMedium, color: ink3}}
        - textField: {value: budgetDraftText, hint: amountHint, onChanged: updateBudgetDraft, onSubmitted: addBudgetDraft}
        - filledButton: {text: addDraftText, icon: add, onPressed: addBudgetDraft}
        - textButton: {text: done, onPressed: goBack}
