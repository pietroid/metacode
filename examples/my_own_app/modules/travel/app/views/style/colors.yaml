# colors: the palette, light and dark. Widgets use these names (`color: accent`).
# Look: warm and fresh, like a summer trip. Plus Jakarta Sans, sea-teal
# actions and a terracotta accent on a sand page, soft round corners. Keys left out are inherited.
colors:
  light:
    bg: '#FBF5EC'
    surface: '#FFFFFF'
    fill: '#F4EADB'
    fillStrong: '#EADBC5'
    line: '#EFE4D3'
    lineStrong: '#DCCAB1'
    ink: '#2B1E16'
    ink2: '#6B5747'
    ink3: '#A08C7A'
    primary: '#0F766E'
    onPrimary: '#FFFFFF'
    accent: '#E0613A'
    onAccent: '#FFFFFF'
    success: '#2F855A'
    warning: '#D9912B'
    danger: '#C2412D'
    info: '#0F766E'
  dark:
    bg: '#1B1511'
    surface: '#251D17'
    fill: '#30261E'
    fillStrong: '#3D3127'
    line: '#352A21'
    lineStrong: '#4C3E32'
    ink: '#F7EEE3'
    ink2: '#C2B09E'
    ink3: '#8A7766'
    primary: '#5EC4B6'
    onPrimary: '#0E2422'
    accent: '#F08A64'
    onAccent: '#2B1209'
    success: '#7CC49A'
    warning: '#EDB45E'
    danger: '#E8826F'
    info: '#5EC4B6'
