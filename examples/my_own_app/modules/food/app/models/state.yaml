# state: Forkcast's state: the onboarding answers (budget, prefs, goal), the
# program matrix and the picked program, the recipe deck being swiped, and
# the shopping list built from the accepted recipes.
state:
  stage: stage
  budget: number
  prefs: list(pref)
  goal: goal
  goalOptions: list(goalOption)
  programs: list(program)
  program: number
  matches: list(number)
  buildStep: number
  days: number
  recipes: list(recipe)
  deck: list(number)
  deckPos: number
  picked: list(number)
  shopping: list(item)
