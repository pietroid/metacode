# typography: the text variants (size, weight, family, spacing).
# Look: editorial. Playfair Display over Source Sans 3, warm earthy tones,
# fully rounded controls. Keys left out are inherited.
typography:
  titleLarge:
    font: display
    size: 24
    weight: 600
    height: 1.2
    tracking: -0.02
  titleSmall:
    font: display
    size: 16
    weight: 500
    height: 1.35
    tracking: -0.01
  labelLarge:
    font: text
    size: 15
    weight: 600
    height: 1.25
    tracking: -0.002
