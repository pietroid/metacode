# colors: the palette, light and dark. Widgets use these names (`color: accent`).
# Look: fresh green in light (food, calories, money), warm earthy in dark.
# Playfair Display over Source Sans 3, fully rounded controls. Keys left out are inherited.
colors:
  light:
    # Fresh green: produce for food, green for money, a tangerine accent
    # for calories and highlights.
    bg: '#F4FAF5'
    surface: '#FFFFFF'
    fill: '#E8F3EA'
    fillStrong: '#D5EAD9'
    line: '#DDEBDF'
    lineStrong: '#BFD8C4'
    ink: '#0F2416'
    ink2: '#4B6352'
    ink3: '#8AA090'
    primary: '#15803D'
    onPrimary: '#FFFFFF'
    accent: '#C2410C'
    onAccent: '#FFFFFF'
    success: '#16A34A'
    warning: '#B45309'
    danger: '#DC2626'
    info: '#0E7490'
  dark:
    bg: '#1A1612'
    surface: '#242019'
    fill: '#2E2821'
    fillStrong: '#3A3229'
    line: '#3A3229'
    lineStrong: '#4E4439'
    ink: '#F5F0E8'
    ink2: '#B8AEA1'
    ink3: '#7D7368'
    primary: '#D4C4B0'
    onPrimary: '#1A1612'
    accent: '#E89B6F'
    onAccent: '#1A1612'
    success: '#7EB88F'
    warning: '#E5B867'
    danger: '#D97B78'
    info: '#8BB0CF'
