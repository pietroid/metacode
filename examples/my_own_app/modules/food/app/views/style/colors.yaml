# colors: the palette, light and dark. Widgets use these names (`color: accent`).
# Look: editorial. Playfair Display over Source Sans 3, warm earthy tones,
# fully rounded controls. Keys left out are inherited.
colors:
  light:
    bg: '#F8F5F0'
    surface: '#FFFDF9'
    fill: '#F0EBE3'
    fillStrong: '#E6DED3'
    line: '#E8E0D5'
    lineStrong: '#D4C8B8'
    ink: '#2A2118'
    ink2: '#6B5E4F'
    ink3: '#A89B8C'
    primary: '#5A4A3A'
    onPrimary: '#FFFDF9'
    accent: '#B85C38'
    onAccent: '#FFFDF9'
    success: '#4A6C5A'
    warning: '#C78D36'
    danger: '#A94442'
    info: '#4A6B8A'
  dark:
    bg: '#1A1612'
    surface: '#242019'
    fill: '#2E2821'
    fillStrong: '#3A3229'
    line: '#3A3229'
    lineStrong: '#4E4439'
    ink: '#F5F0E8'
    ink2: '#B8AEA1'
    ink3: '#7D7368'
    primary: '#D4C4B0'
    onPrimary: '#1A1612'
    accent: '#E89B6F'
    onAccent: '#1A1612'
