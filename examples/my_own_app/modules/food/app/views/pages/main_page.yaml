# MainPage: Forkcast's only page: the screen for the current stage
# (onboarding steps, Building, PlanScreen, SwipeScreen, ShoppingScreen), each
# laid out by ScreenFrame. Embedded `contained`.
MainPage:
  match:
    value: screen
    cases:
      budget: BudgetStep
      prefs: PrefsStep
      goal: GoalStep
      building: Building
      plan: PlanScreen
      swipe: SwipeScreen
      shopping: ShoppingScreen
