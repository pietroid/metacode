# ShopRow: one ingredient to buy: a checkbox (in the cart), name, quantity and price.
ShopRow:
  padding:
    vertical: 6
    child:
      row:
        spacing: 8
        children:
        - checkbox: {value: itemChecked, onChanged: toggleItem}
        - expanded:
            column:
              crossAxisAlignment: start
              spacing: 2
              children:
              - text: {value: itemName, maxLines: 1, style: {variant: labelLarge}}
              - text: {value: itemQty, style: {variant: bodySmall, color: ink3}}
        - text: {value: itemPrice, style: {variant: labelMedium}}
