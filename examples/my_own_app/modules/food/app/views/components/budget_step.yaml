# BudgetStep: onboarding step 1: the monthly budget, big in the local
# currency with a per-day hint, set with a slider ($100 to $800); Continue
# pinned at the bottom.
BudgetStep:
  ScreenFrame:
    body:
      column:
        crossAxisAlignment: stretch
        spacing: 32
        children:
        - StepHeader: {progress: 0.33, step: step1, title: budgetTitle, hint: budgetHint}
        - container:
            color: fill
            radius: 28
            padding: {vertical: 32, horizontal: 20}
            child:
              column:
                spacing: 6
                children:
                - text:
                    value: budgetText
                    maxLines: 1
                    align: center
                    style:
                      variant: displaySmall
                      color: primary
                - text:
                    value: budgetPerDay
                    align: center
                    style:
                      variant: bodyMedium
                      color: ink2
        - column:
            crossAxisAlignment: stretch
            spacing: 4
            children:
            - slider:
                value: budgetValue
                min: 100
                max: 800
                divisions: 14
                onChanged: setBudget
            - padding:
                horizontal: 8
                child:
                  row:
                    children:
                    - text: {value: budgetMin, style: {variant: labelSmall, color: ink3}}
                    - spacer: {}
                    - text: {value: budgetMax, style: {variant: labelSmall, color: ink3}}
    footer:
      filledButton:
        text: next
        icon: arrowForward
        onPressed: openPrefs
