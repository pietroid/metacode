# PickedDone: the end of the swipe: the accepted recipes, or a gentle note
# when nothing was accepted (its button is in PickedDoneActions).
PickedDone:
  if:
    condition: hasPicked
    then:
      column:
        crossAxisAlignment: stretch
        spacing: 12
        children:
        - text: {value: yourPicks, style: {variant: titleMedium}}
        - listView:
            data: pickedList
            itemBuilder: PickedRow
    else:
      padding:
        top: 32
        child:
          text: {value: nothingPicked, align: center, style: {variant: bodyLarge, color: ink2}}
