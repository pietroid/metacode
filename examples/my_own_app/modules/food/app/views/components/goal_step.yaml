# GoalStep: onboarding step 3: the program goal (one of GoalCard), then
# Build my program once one is picked, pinned at the bottom.
GoalStep:
  ScreenFrame:
    body:
      column:
        crossAxisAlignment: stretch
        spacing: 28
        children:
        - StepHeader: {progress: 1, step: step3, title: goalTitle, hint: goalHint}
        - listView:
            data: goalList
            itemBuilder: GoalCard
    footer:
      NavButtons:
        next:
          if:
            condition: hasGoal
            then:
              filledButton:
                text: buildMyProgram
                icon: sparkle
                onPressed: buildProgram
            else:
              container:
                height: 48
                radius: 999
                color: fill
                child:
                  center:
                    text:
                      value: pickAGoal
                      maxLines: 1
                      style:
                        variant: labelMedium
                        color: ink3
