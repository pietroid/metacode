# Building: the fake processing after onboarding: the logo, a progress bar and
# BuildRows appearing one by one.
Building:
  ScreenFrame:
    body:
      column:
        crossAxisAlignment: stretch
        spacing: 20
        children:
        - sizedBox: {height: 48}
        - center:
            image:
              src: examples/my_own_app/app/views/style/images/forkcast_logo.svg
              width: 72
              height: 72
        - text:
            value: building
            align: center
            style:
              variant: titleLarge
        - progress:
            value: buildProgress
        - listView:
            data: buildLines
            itemBuilder: BuildRow
    footer:
      sizedBox: {height: 0}
