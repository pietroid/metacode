# FoodRow: one list row, a food in the list: name, info and -/+ servings.
FoodRow:
  padding:
    vertical: 2
    child:
      row:
        spacing: 4
        children:
        - expanded:
            column:
              crossAxisAlignment: start
              children:
              - text:
                  value: foodName
                  style:
                    variant: titleSmall
              - text:
                  value: foodInfo
                  style:
                    variant: bodySmall
                    color: ink3
        - iconButton:
            icon: remove
            tooltip: removeOne
            onPressed: removeFood
        - sizedBox:
            width: 20
            child:
              text:
                value: foodCount
                style:
                  variant: labelLarge
                align: center
        - iconButton:
            icon: add
            tooltip: addOne
            onPressed: addFood
