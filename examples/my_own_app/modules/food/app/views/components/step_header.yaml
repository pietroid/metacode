# StepHeader: the top of an onboarding step: BrandBar with the step count,
# a progress bar at `.progress`, then `.title` and `.hint`.
StepHeader:
  column:
    crossAxisAlignment: stretch
    children:
    - BrandBar:
        trailing:
          text:
            value: .step
            style:
              variant: labelSmall
              color: ink3
    - sizedBox: {height: 16}
    - progress:
        value: .progress
    - sizedBox: {height: 32}
    - text:
        value: .title
        style:
          variant: titleLarge
    - sizedBox: {height: 10}
    - text:
        value: .hint
        style:
          variant: bodyMedium
          color: ink2
