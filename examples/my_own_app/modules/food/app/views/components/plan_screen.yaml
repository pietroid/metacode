# PlanScreen: the home after onboarding, kept light: a warm greeting with the
# program (name, tagline, daily targets, budget fit), the shopping list entry,
# then Meters; the days stepper and Suggest my recipes pinned at the bottom.
PlanScreen:
  ScreenFrame:
    body:
      column:
        crossAxisAlignment: stretch
        spacing: 28
        children:
        - BrandBar:
            trailing:
              textButton:
                text: restart
                onPressed: startOver
        - column:
            crossAxisAlignment: start
            spacing: 8
            children:
            - text: {value: yourProgram, style: {variant: labelLarge, color: primary}}
            - text: {value: programName, style: {variant: headlineSmall}}
            - text: {value: programTagline, style: {variant: bodyMedium, color: ink2}}
        - column:
            crossAxisAlignment: stretch
            spacing: 14
            children:
            - row:
                spacing: 10
                children:
                - expanded: {StatTile: {value: programKcal, label: kcalDay}}
                - expanded: {StatTile: {value: programProtein, label: protein}}
                - expanded: {StatTile: {value: programCarbs, label: carbs}}
            - row:
                spacing: 8
                crossAxisAlignment: start
                children:
                - if:
                    condition: programFits
                    then: {icon: {name: checkCircle, size: 16, color: success}}
                    else: {icon: {name: warning, size: 16, color: warning}}
                - expanded:
                    text: {value: programCost, style: {variant: bodySmall, color: ink2}}
        - if:
            condition: hasShopping
            then: ShoppingEntry
        - Meters
    footer:
      column:
        crossAxisAlignment: stretch
        spacing: 4
        children:
        - row:
            children:
            - expanded:
                text: {value: planNext, style: {variant: labelLarge}}
            - iconButton: {icon: remove, tooltip: fewerDaysTip, onPressed: fewerDays}
            - text: {value: daysText, style: {variant: labelLarge}}
            - iconButton: {icon: add, tooltip: moreDaysTip, onPressed: moreDays}
        - filledButton:
            text: suggestCta
            icon: sparkle
            onPressed: suggestRecipes
