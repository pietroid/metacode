# PrefsStep: onboarding step 2: food prefs and restrictions as a two-column
# grid of illustrated PrefCards, any number selected; Back and Continue
# pinned at the bottom.
PrefsStep:
  ScreenFrame:
    body:
      column:
        crossAxisAlignment: stretch
        spacing: 28
        children:
        - StepHeader: {progress: 0.66, step: step2, title: prefsTitle, hint: prefsHint}
        - gridView:
            data: prefList
            itemBuilder: PrefCard
            columns: 2
            spacing: 12
            aspectRatio: 1.15
    footer:
      NavButtons:
        next:
          filledButton:
            text: next
            icon: arrowForward
            onPressed: openGoal
