# ShoppingScreen: the shopping list: a hint, the total and a ShopRow per
# ingredient to check off; Shopping done pinned at the bottom adds what is
# checked to the plan's budget and calorie meters.
ShoppingScreen:
  ScreenFrame:
    body:
      column:
        crossAxisAlignment: stretch
        spacing: 20
        children:
        - row:
            spacing: 4
            children:
            - iconButton: {icon: arrowBack, tooltip: backToPlan, onPressed: goBack}
            - expanded:
                text: {value: shoppingList, style: {variant: titleLarge}}
        - column:
            crossAxisAlignment: start
            spacing: 4
            children:
            - text: {value: shoppingHint, style: {variant: bodyMedium, color: ink2}}
            - text: {value: shopTotal, style: {variant: labelLarge}}
        - listView:
            data: shopList
            itemBuilder: ShopRow
            empty: emptyList
    footer:
      filledButton: {text: shoppingDone, icon: check, onPressed: finishShopping}
