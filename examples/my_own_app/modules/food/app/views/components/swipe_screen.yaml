# SwipeScreen: the recipe picker: a title with a close button, a progress
# bar with the pick count, then RecipeCard one at a time, or PickedDone when
# over. The footer holds SwipeActions, or PickedDoneActions when over.
SwipeScreen:
  ScreenFrame:
    body:
      column:
        crossAxisAlignment: stretch
        spacing: 20
        children:
        - row:
            children:
            - expanded:
                text: {value: pickRecipes, style: {variant: titleLarge}}
            - iconButton: {icon: close, tooltip: close, onPressed: showPlan}
        - row:
            spacing: 12
            children:
            - expanded:
                progress:
                  value: pickProgress
            - text: {value: pickCounter, style: {variant: labelMedium, color: ink2}}
        - if:
            condition: deckDone
            then: PickedDone
            else: RecipeCard
    footer:
      if:
        condition: deckDone
        then: PickedDoneActions
        else: SwipeActions
