# food: Forkcast, a pocket meal planner embedded in the landing page carousel
# (`miniApp: food`). Onboarding asks for a monthly budget, food prefs and a
# goal, matches a program from the matrix (goal x diet), suggests recipes to
# accept or refuse, then builds a shopping list that fills the budget and
# kcal bars. All data below is synthetic; prices are in USD (shown as R$ at
# a fixed rate in Portuguese).
name: food
description: Forkcast plans what you eat and what you spend. Tell it your budget,
  diet and goal; it builds a program, suggests recipes and a shopping list.
state:
  stage: onboarding
  budget: 300
  goal: none
  program: -1
  matches: []
  buildStep: 0
  days: 5
  deck: []
  deckPos: 0
  picked: []
  shopping: []
  prefs:
  - {key: vegan, name: Vegan, namePt: Vegano, image: vegan, base: true, selected: false}
  - {key: vegetarian, name: Vegetarian, namePt: Vegetariano, image: vegetarian, base: true, selected: false}
  - {key: pescatarian, name: Pescatarian, namePt: Pescetariano, image: pescatarian, base: true, selected: false}
  - {key: glutenFree, name: Gluten-free, namePt: Sem glúten, image: gluten_free, base: false, selected: false}
  - {key: lactoseFree, name: Lactose-free, namePt: Sem lactose, image: lactose_free, base: false, selected: false}
  - {key: nutFree, name: Nut-free, namePt: Sem castanhas, image: nut_free, base: false, selected: false}
