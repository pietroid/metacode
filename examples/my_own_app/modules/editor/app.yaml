# editor: edits one of the site's example apps (food, travel, work) while it
# runs. ProjectPage asks which; openProject loads its source through the
# remote loadProject (from the Claude bridge, tool/claude_server.dart) into
# `draft`, the whole app as files (a metacodeProject; a plain counter until
# then), in `remote` state, and opens EditorPage: the draft running as a
# dynamic module inside a PhoneFrame, the EditorPanel on its right.
# The root opens ProjectPage with core.modules.editor.navigator.
# askClaude asks the remote askClaude (the only code with HTTP) to send the
# prompt and the draft to the bridge, which edits it with the metacode MCP;
# the draft and the run's cost, time and turns come back as remote fields,
# and add up per project (projectCost, projectMs, projectTurns) until
# resetDraft loads its source again, history cleared; `draftOn` false for a moment restarts it.
name: editor
description: Edits a small app while it runs.
state:
  remote:
    draft:
      files:
        - name: app.yaml
          content: |
            name: counter
            state:
              count: 0
      folders:
        - name: app
          files: []
          folders:
            - name: models
              files:
                - name: state.yaml
                  content: |
                    state:
                      count: number
              folders: []
            - name: actions
              files:
                - name: increment.dart
                  content: |
                    import '../../.generated/state.dart';

                    Future<void> increment(State state, void Function(StateDelta) emit) async {
                      emit(StateDelta(count: state.count + 1));
                    }
                - name: decrement.dart
                  content: |
                    import '../../.generated/state.dart';

                    Future<void> decrement(State state, void Function(StateDelta) emit) async {
                      emit(StateDelta(count: state.count - 1));
                    }
              folders: []
            - name: views
              files: []
              folders:
                - name: values
                  files:
                    - name: count_text.dart
                      content: |
                        import '../../../.generated/state.dart';

                        String countText(State state) => state.count.toString();
                  folders: []
                - name: labels
                  files:
                    - name: en.yaml
                      content: |
                        en:
                          title: Counter
                          caption: Tap + or -
                  folders: []
                - name: components
                  files:
                    - name: count_button.yaml
                      content: |
                        CountButton:
                          tappable:
                            onTap: .tap
                            child:
                              container:
                                width: 64
                                height: 64
                                radius: 32
                                color: '#111111'
                                child: {center: {icon: {name: .icon, size: 26, color: '#FFFFFF'}}}
                  folders: []
                - name: pages
                  files:
                    - name: main_page.yaml
                      content: |
                        MainPage:
                          container:
                            color: '#FFFFFF'
                            child:
                              column:
                                crossAxisAlignment: stretch
                                children:
                                - padding:
                                    horizontal: 24
                                    vertical: 8
                                    child:
                                      text: {value: title, style: {variant: titleLarge, fontWeight: w700, color: '#1A1A1A'}}
                                - expanded:
                                    child:
                                      center:
                                        column:
                                          mainAxisAlignment: center
                                          spacing: 4
                                          children:
                                          - text: {value: countText, style: {fontSize: 96, fontWeight: w300, color: '#1A1A1A'}}
                                          - text: {value: caption, style: {variant: bodyMedium, color: '#9A9A9A'}}
                                - padding:
                                    all: 32
                                    child:
                                      row:
                                        mainAxisAlignment: center
                                        spacing: 24
                                        children:
                                        - CountButton: {icon: remove, tap: decrement}
                                        - CountButton: {icon: add, tap: increment}
                  folders: []
    projectName: ''
    saved: []
    runReply: ''
    runCost: 0.0
    runMs: 0
    runTurns: 0
    projectCost: 0.0
    projectMs: 0
    projectTurns: 0
  ephemeral:
    draftOn: true
    prompt: ''
    asking: false
    askError: ''
    opening: ''
