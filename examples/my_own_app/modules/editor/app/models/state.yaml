# state: the editor's state by scope; initial values in app.yaml.
# ephemeral: draftOn (false for a moment while the draft restarts), the
# prompt, whether a run goes, why the last call failed (askError) and the
# project being opened (opening, '' when none).
# remote: the draft and which project it is (projectName: food, travel,
# work; '' for the starter counter), every project as last edited (saved:
# put away by openProject when switching, with their history), what Claude
# has spent on this project since it was loaded or reset (projectCost in
# USD, projectMs, projectTurns), and the last Claude run (reply, cost in USD,
# time in ms, turns), written by the remote askClaude.
state:
  ephemeral:
    draftOn: boolean
    prompt: string
    asking: boolean
    askError: string
    opening: string
  remote:
    draft: metacodeProject
    projectName: string
    saved: list(savedDraft)
    runReply: string
    runCost: number
    runMs: number
    runTurns: number
    projectCost: number
    projectMs: number
    projectTurns: number
