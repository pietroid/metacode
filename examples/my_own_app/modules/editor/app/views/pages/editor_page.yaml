# EditorPage: the editor, opened by openProject. An app bar (the scaffold's
# own back button to ProjectPage, the project's title: currentTitle) over
# the draft running live as a dynamic module (`miniApp: {project:
# draftProject}`) in a PhoneFrame, with the EditorPanel on its right when
# wide; on a phone, the phone and then the panel, in one scroll. The draft is
# hidden for a moment (showDraft) when it restarts.
EditorPage:
  scaffold:
    appBar:
      title: {text: {value: currentTitle, maxLines: 1, style: {variant: titleMedium}}}
    body:
      container:
        color: bg
        child:
          responsive:
            breakpoint: 760
            wide:
              padding:
                all: 32
                child:
                  row:
                    crossAxisAlignment: start
                    spacing: 40
                    children:
                    - expanded: {child: {center: {scroll: {PhoneFrame: {child: {if: {condition: showDraft, then: {miniApp: {project: draftProject}}}}}}}}}
                    - sizedBox: {width: 360, child: {scroll: EditorPanel}}
            narrow:
              scroll:
                padding:
                  all: 16
                  child:
                    column:
                      crossAxisAlignment: stretch
                      spacing: 24
                      children:
                      - center: {PhoneFrame: {child: {if: {condition: showDraft, then: {miniApp: {project: draftProject}}}}}}
                      - EditorPanel
