# EditorPanel: the editing side, right of the phone (below it on a phone):
# one card, two sections with the same type scale (titleSmall heading,
# bodySmall hint): Claude (ClaudeBox), then the project (Restart: the
# draft's state over, restartDraft; Reset: its source again, resetDraft).
EditorPanel:
  card:
    padding: 24
    child:
      column:
        crossAxisAlignment: stretch
        spacing: 24
        children:
        - column:
            crossAxisAlignment: stretch
            spacing: 12
            children:
            - column:
                crossAxisAlignment: start
                spacing: 4
                children:
                - text: {value: claudeTitle, style: {variant: titleSmall}}
                - text: {value: claudeHint, style: {variant: bodySmall, color: ink2}}
            - ClaudeBox
        - divider: {}
        - column:
            crossAxisAlignment: stretch
            spacing: 12
            children:
            - column:
                crossAxisAlignment: start
                spacing: 4
                children:
                - text: {value: projectSectionTitle, style: {variant: titleSmall}}
                - text: {value: projectSectionHint, style: {variant: bodySmall, color: ink2}}
            - wrap:
                spacing: 8
                runSpacing: 8
                children:
                - outlinedButton: {text: restartText, icon: refresh, onPressed: restartDraft}
                - textButton: {text: resetText, icon: delete, onPressed: resetDraft}
