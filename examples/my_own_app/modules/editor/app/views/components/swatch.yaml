# Swatch: one color of the palette (by `index`): a circle with a hairline
# edge (so the near-black one shows on dark), a check on the one the draft's
# buttons use (isPicked); tapping it picks it (pickColor).
Swatch:
  tappable:
    onTap: pickColor
    child:
      container:
        width: 40
        height: 40
        radius: 20
        color: swatchColor
        borderColor: lineStrong
        child:
          if:
            condition: isPicked
            then: {center: {icon: {name: check, size: 18, color: '#FFFFFF'}}}
