# Content: the plant watering screen: header, summary, Tip and the list.
Content:
  column:
    crossAxisAlignment: stretch
    spacing: 10
    children:
    - row:
        children:
        - expanded:
            text:
              value: plantCare
              style:
                variant: titleLarge
        - textButton:
            text: nextDayText
            icon: arrowForward
            onPressed: nextDay
    - text:
        value: plantsText
        style:
          variant: titleSmall
    - Tip
    - listView:
        data: plantList
        itemBuilder: PlantRow
