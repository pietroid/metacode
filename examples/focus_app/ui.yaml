homePage:
  scaffold:
    body:
      homeContent
    floatingActionButton:
      icon: add

# empty state
emptyState:
  center:
    text: "Adicione uma nova tarefa"

# default state
defaultState:
  column:
    - text: "Minhas tarefas"
    - listView:
        data: taskList
        itemBuilder: taskTile

taskTile:
    listTile:
      title: taskTitle
      leading: taskCheckbox
      onTap: taskTapped

taskCheckbox:
  checkbox:
    value: taskDone
    onChanged: taskToggled