  routes:
    home: MainPage
    item: ItemPage
    cart: {bottomSheet: CartSheet}
    checkout: CheckoutPage
    storePicker: {dialog: StorePickerDialog}
    favoritePicker: {dialog: FavoriteStoreDialog}
    order: OrderPage

  pages:
    MainPage:
      purpose: >-
        If showOnboarding, the full-screen OnboardingFlow. Otherwise a
        navigationBar with four tabs (tabMenu, tabRewards, tabOrders,
        tabProfile; icons restaurant, star, receipt, person), selected tabIndex,
        selectTab on tap, showing MenuTab, RewardsTab, OrdersTab or ProfileTab.
        On wide screens the bar may become a side rail.
      uses: [OnboardingFlow, MenuTab, RewardsTab, OrdersTab, ProfileTab, showOnboarding, tabIndex, selectTab, tabMenu, tabRewards, tabOrders, tabProfile]
    ItemPage:
      purpose: >-
        The selected item. App bar with back. Phone: the big ItemHero tile on
        top, then ItemOptions, then a bottom bar with the addToCartText button
        running addToCart. Desktop/wide: two columns, ItemHero left, ItemOptions
        and the button right, centered with a max width.
      uses: [ItemHero, ItemOptions, addToCartText, addToCart]
    CartSheet:
      purpose: >-
        Bottom sheet titled cartTitle with a close button: the list of CartLineRow
        over cartLines, or cartEmpty text when cartIsEmpty; then subtotal with
        subtotalText and a full-width checkout button (goToCheckout), disabled or
        hidden when cartIsEmpty.
      uses: [CartLineRow, cartLines, cartIsEmpty, subtotalText, goToCheckout, closeSheet, cartTitle, cartEmpty, subtotal, checkout, close]
    CheckoutPage:
      purpose: >-
        App bar checkoutTitle with back. Sections in cards, centered max width
        on desktop: pickupStore (checkoutStoreName, checkoutStoreAddress, a
        change button running openStorePicker); pickupTimeTitle with
        PickupOption rows over pickupOptions; paymentTitle with PaymentOption
        rows over paymentOptions; a summary card (subtotal + subtotalText,
        earnStarsText when rewardsEnabled); a full-width placeOrderLabel button running placeOrder.
      uses: [PickupOption, PaymentOption, checkoutStoreName, checkoutStoreAddress, openStorePicker, pickupOptions, paymentOptions, subtotalText, earnStarsText, rewardsEnabled, placeOrder, placeOrderLabel, checkoutTitle, pickupStore, change, pickupTimeTitle, paymentTitle, subtotal]
    StorePickerDialog:
      purpose: Dialog titled chooseStore listing StorePickerRow over storesList, and a close button.
      uses: [StorePickerRow, storesList, closeSheet, chooseStore, close]
    FavoriteStoreDialog:
      purpose: Dialog titled favoriteStoreTitle listing FavoritePickerRow over storesList, and a close button.
      uses: [FavoritePickerRow, storesList, closeSheet, favoriteStoreTitle, close]
    OrderPage:
      purpose: >-
        The selected order. App bar orderNumberText with back. OrderStatusCard on
        top, then orderDetails card: OrderLineRow over orderLines, total with
        orderTotalText, pickupAt orderStoreText and orderPickupText, paidWith
        orderPaymentText, orderPlacedText. A backToMenu button (goToMenu).
        Centered max width on desktop; two columns allowed when wide.
      uses: [OrderStatusCard, OrderLineRow, orderNumberText, orderLines, orderTotalText, orderStoreText, orderPickupText, orderPaymentText, orderPlacedText, goToMenu, orderDetails, total, pickupAt, paidWith, backToMenu]

  components:
    OnboardingFlow:
      purpose: >-
        Full screen onboarding: a skip text button top right (skipOnboarding),
        a big icon in a soft circle (onboardingIcon), onboardingTitle,
        onboardingBody; on step 1 (showStoreStep) a list of FavoriteStoreRow
        over storesList; on step 2 (showRewardsStep) a card with a toggle
        rewardsToggle bound to rewardsEnabled running setRewards; a progress
        indicator (onboardingProgress) and a full-width onboardingNextText
        button running nextStep. Centered with a max width on desktop.
      uses: [FavoriteStoreRow, onboardingIcon, onboardingTitle, onboardingBody, showStoreStep, showRewardsStep, storesList, rewardsEnabled, setRewards, onboardingProgress, onboardingNextText, nextStep, skipOnboarding, skip, rewardsToggle]
    FavoriteStoreRow:
      purpose: Store `index` (storeName, storeAddress, storeDistance) with a check icon favoriteStoreIcon colored favoriteStoreColor; tap runs chooseFavorite.
      uses: [storeName, storeAddress, storeDistance, favoriteStoreIcon, favoriteStoreColor, chooseFavorite]
    FavoritePickerRow:
      purpose: Store `index` (storeName, storeAddress, storeDistance) with favoriteStoreIcon colored favoriteStoreColor; tap runs pickFavorite.
      uses: [storeName, storeAddress, storeDistance, favoriteStoreIcon, favoriteStoreColor, pickFavorite]
    StorePickerRow:
      purpose: Store `index` (storeName, storeAddress, storeDistance) with checkoutStoreIcon colored checkoutStoreColor; tap runs pickStore.
      uses: [storeName, storeAddress, storeDistance, checkoutStoreIcon, checkoutStoreColor, pickStore]
    MenuTab:
      purpose: >-
        Header (appTitle small, menuTitle large), a search textField (searchHint,
        search icon) running updateSearch, a horizontal row of CategoryChip over
        categoryList (hidden while searching, isSearching), then a responsive
        grid of MenuItemCard over visibleItems (2 columns phone, 3-4 wide) or
        noResults text when noItems; a floating CartBar at the bottom when
        cartHasItems.
      uses: [CategoryChip, MenuItemCard, CartBar, updateSearch, categoryList, isSearching, visibleItems, noItems, cartHasItems, appTitle, menuTitle, searchHint, noResults]
    CategoryChip:
      purpose: Category `index` pill with categoryLabel, filled when categorySelected (chipFill, chipInk); tap runs selectCategory.
      uses: [categoryLabel, categorySelected, chipFill, chipInk, selectCategory]
    MenuItemCard:
      purpose: Visible item `index` card - a rounded photo-like tile in itemColor with a big white itemIcon, then itemName and itemPriceText; tap runs openItem.
      uses: [itemColor, itemIcon, itemName, itemPriceText, openItem]
    CartBar:
      purpose: A rounded primary bar - cart icon, cartCountText, viewCart and cartSubtotalShort on the right; tap runs openCart.
      uses: [cartCountText, cartSubtotalShort, openCart, viewCart]
    ItemHero:
      purpose: A tall rounded tile in selectedColor with a big white selectedIcon, then selectedName, selectedPriceText and selectedDescription.
      uses: [selectedColor, selectedIcon, selectedName, selectedPriceText, selectedDescription]
    ItemOptions:
      purpose: >-
        When selectedCustomizable - size title and a row of
        SizeChip over sizeOptions; milkTitle + MilkChip over milkOptions;
        extraShots stepper (removeShot, shotsText, addShot). Always - quantity
        stepper (decQuantity, quantityText, incQuantity).
      uses: [SizeChip, MilkChip, selectedCustomizable, sizeOptions, milkOptions, shotsText, addShot, removeShot, quantityText, incQuantity, decQuantity, size, milkTitle, extraShots, quantity]
    SizeChip:
      purpose: Size `index` choice - sizeLabel and sizeExtraText under it, filled when sizeSelected; tap runs selectSize.
      uses: [sizeLabel, sizeExtraText, sizeSelected, selectSize]
    MilkChip:
      purpose: Milk `index` pill - milkLabel, filled when milkSelected; tap runs selectMilk.
      uses: [milkLabel, milkSelected, selectMilk]
    CartLineRow:
      purpose: Cart line `index` - a small tile (lineColor, lineIcon), lineName over lineDetails, lineTotalText, a stepper (decLine, lineQuantityText, incLine) and a remove icon button (removeLine).
      uses: [lineColor, lineIcon, lineName, lineDetails, lineTotalText, lineQuantityText, incLine, decLine, removeLine]
    PickupOption:
      purpose: Pickup option `index` row - schedule icon, pickupLabel, a radio-like check when pickupSelected; tap runs selectPickup.
      uses: [pickupLabel, pickupSelected, selectPickup]
    PaymentOption:
      purpose: Payment option `index` row - paymentIcon, paymentLabel, a check when paymentSelected; tap runs selectPayment.
      uses: [paymentIcon, paymentLabel, paymentSelected, selectPayment]
    OrderStatusCard:
      purpose: >-
        A hero card - statusIcon in a circle colored statusColor, statusTitle,
        statusBody, a linear progress (orderProgress), and three step labels in
        a row (OrderStep over orderSteps).
      uses: [OrderStep, statusIcon, statusColor, statusTitle, statusBody, orderProgress, orderSteps]
    OrderStep:
      purpose: Step `index` - a small dot colored stepColor and stepLabel under it.
      uses: [stepColor, stepLabel]
    OrderLineRow:
      purpose: Order line `index` - orderLineName over orderLineDetails, orderLineTotal on the right.
      uses: [orderLineName, orderLineDetails, orderLineTotal]
    RewardsTab:
      purpose: >-
        Title rewardsTitle. When rewardsEnabled - StarsCard, lastRedeemedText
        banner when hasRedeemed, redeemableTitle and RewardRow over rewardsList.
        Otherwise a card with rewardsOffTitle, rewardsOffBody and a
        turnOnRewards button (enableRewards). Centered max width on desktop.
      uses: [StarsCard, RewardRow, rewardsEnabled, hasRedeemed, lastRedeemedText, rewardsList, enableRewards, rewardsTitle, redeemableTitle, rewardsOffTitle, rewardsOffBody, turnOnRewards]
    StarsCard:
      purpose: A rich primary card - starsBalance label, big starsText with a star icon, a progress bar (starsProgress), starsToGoText.
      uses: [starsText, starsProgress, starsToGoText, starsBalance]
    RewardRow:
      purpose: Reward `index` - rewardIcon in a circle, rewardName, rewardStarsText, a redeem button (redeemReward) enabled when rewardAvailable.
      uses: [rewardIcon, rewardName, rewardStarsText, rewardAvailable, redeemReward, redeem]
    OrdersTab:
      purpose: Title ordersTitle, then OrderHistoryRow over orderHistory, or noOrders text when ordersEmpty. Centered max width on desktop.
      uses: [OrderHistoryRow, orderHistory, ordersEmpty, ordersTitle, noOrders]
    OrderHistoryRow:
      purpose: Order `index` card - receipt icon, historyTitle over historySubtitle, historyTotal and a status pill (historyStatus, historyStatusColor); tap runs openOrder.
      uses: [historyTitle, historySubtitle, historyTotal, historyStatus, historyStatusColor, openOrder]
    ProfileTab:
      purpose: >-
        Title profileTitle; an avatar with profileInitials and profileName; a
        nameLabel textField running updateName; a favoriteStoreTitle row with
        favoriteStoreName and change (openFavoritePicker); a notificationsTitle
        toggle (notificationsBody) bound to notificationsEnabled running
        setNotifications; appearance with ThemeChip over themeOptions; a
        replayOnboarding text button (restartOnboarding). Centered max width.
      uses: [ThemeChip, profileInitials, profileName, updateName, favoriteStoreName, openFavoritePicker, notificationsEnabled, setNotifications, themeOptions, restartOnboarding, profileTitle, nameLabel, favoriteStoreTitle, change, notificationsTitle, notificationsBody, appearance, replayOnboarding]
    ThemeChip:
      purpose: Theme choice `index` pill - themeIcon and themeLabel, filled when themeSelected; tap runs selectTheme.
      uses: [themeIcon, themeLabel, themeSelected, selectTheme]

  actions:
    nextStep:
      purpose: Advances onboardingStep; on the last step (2) finishes - onboarded true, checkoutStore = favoriteStore.
      params: [emit]
      test: step 0 -> 1; step 2 -> onboarded true and checkoutStore equals favoriteStore.
    skipOnboarding:
      purpose: Sets onboarded true and checkoutStore = favoriteStore.
      params: [emit]
      test: onboarded becomes true.
    restartOnboarding:
      purpose: Sets onboarded false and onboardingStep 0.
      params: [emit]
      test: onboarded false and step 0.
    chooseFavorite:
      purpose: Sets favoriteStore to index.
      params: [emit, index]
      test: index 2 -> favoriteStore 2.
    pickFavorite:
      purpose: Sets favoriteStore to index and pops the dialog.
      params: [emit, core, index]
      test: favoriteStore 1 and navigation is ['pop'].
    setRewards:
      purpose: Sets rewardsOn to the value.
      params: [emit]
      value: bool
      test: true -> rewardsOn true.
    enableRewards:
      purpose: Sets rewardsOn true.
      params: [emit]
      test: rewardsOn true.
    selectTab:
      purpose: Sets currentTab to Tab.values[index].
      params: [emit, index]
      test: index 2 -> currentTab orders.
    selectCategory:
      purpose: Sets category to Category.values[index].
      params: [emit, index]
      test: index 3 -> category bakery.
    updateSearch:
      purpose: Keeps the typed search text.
      params: [emit]
      value: String
      test: search becomes the value.
    openItem:
      purpose: >-
        Maps visible item index (same filter as visibleItems - category, or name
        search across all when search is non-empty) to its menu index, sets
        selectedItem, resets the draft (medium, whole milk or none when not
        customizable, 0 shots, quantity 1) and pushes item.
      params: [emit, core, index]
      test: category tea, index 1 -> selectedItem 5 and navigation ['push item'].
    selectSize:
      purpose: Sets draftSize to DrinkSize.values[index].
      params: [emit, index]
      test: index 2 -> large.
    selectMilk:
      purpose: Sets draftMilk to Milk.values[index].
      params: [emit, index]
      test: index 1 -> oat.
    addShot:
      purpose: draftShots + 1, at most 3.
      params: [emit]
      test: 3 stays 3; 0 -> 1.
    removeShot:
      purpose: draftShots - 1, at least 0.
      params: [emit]
      test: 0 stays 0.
    incQuantity:
      purpose: draftQuantity + 1, at most 20.
      params: [emit]
      test: 1 -> 2.
    decQuantity:
      purpose: draftQuantity - 1, at least 1.
      params: [emit]
      test: 1 stays 1.
    addToCart:
      purpose: >-
        Adds the draft as a cart line for the selected item (merging quantity
        into an identical line) and pops the item page.
      params: [emit, core]
      test: a new item adds a line; adding the same config again merges quantity; navigation ['pop'].
    openCart:
      purpose: Pushes the cart sheet.
      params: [core]
      test: navigation ['push cart'].
    closeSheet:
      purpose: Pops the current sheet or dialog.
      params: [core]
      test: navigation ['pop'].
    incLine:
      purpose: Cart line index quantity + 1.
      params: [emit, index]
      test: line 0 quantity 1 -> 2.
    decLine:
      purpose: Cart line index quantity - 1; at 1 the line is removed.
      params: [emit, index]
      test: line 1 quantity 2 -> 1; line 0 quantity 1 -> removed.
    removeLine:
      purpose: Removes cart line index.
      params: [emit, index]
      test: cart length 2 -> 1.
    goToCheckout:
      purpose: Pops the cart sheet, sets checkoutStore to favoriteStore, and pushes checkout.
      params: [emit, core]
      test: navigation ['pop', 'push checkout'].
    openStorePicker:
      purpose: Pushes the storePicker dialog.
      params: [core]
      test: navigation ['push storePicker'].
    pickStore:
      purpose: Sets checkoutStore to index and pops the dialog.
      params: [emit, core, index]
      test: checkoutStore 2 and navigation ['pop'].
    openFavoritePicker:
      purpose: Pushes the favoritePicker dialog.
      params: [core]
      test: navigation ['push favoritePicker'].
    selectPickup:
      purpose: Sets pickup to PickupTime.values[index].
      params: [emit, index]
      test: index 2 -> in30.
    selectPayment:
      purpose: Sets paymentMethod to Payment.values[index].
      params: [emit, index]
      test: index 1 -> wallet.
    placeOrder:
      purpose: >-
        Builds an order (number nextOrderNumber, the cart lines, total from
        linePrice, checkoutStore, pickup, paymentMethod, status placed, placedAt
        'Just now'), prepends it to orders, clears the cart, increments
        nextOrderNumber, adds floor(total) stars when rewardsOn, selects order 0,
        pops checkout and pushes order. Then after Future.delayed 3s emits the
        order (still first in the list built here) as preparing, and after 5s
        more as ready.
      params: [emit, core]
      uses: [linePrice]
      test: orders grows by one with status placed then ends ready; cart empty; stars +floor(total) when rewardsOn; navigation ['pop', 'push order'].
    openOrder:
      purpose: Sets selectedOrder to index and pushes order.
      params: [emit, core, index]
      test: selectedOrder 1 and navigation ['push order'].
    goToMenu:
      purpose: Sets currentTab menu and pops to the first route (pop the order page).
      params: [emit, core]
      test: currentTab menu and navigation ends with a pop.
    redeemReward:
      purpose: When stars >= reward index stars, subtracts them and sets lastRedeemed to the reward name.
      params: [emit, index]
      test: stars 112, index 0 -> stars 87 and lastRedeemed 'Extra shot or syrup'; index 2 -> unchanged.
    updateName:
      purpose: Sets userName to the value.
      params: [emit]
      value: String
      test: userName becomes the value.
    setNotifications:
      purpose: Sets notificationsOn to the value.
      params: [emit]
      value: bool
      test: false -> notificationsOn false.
    selectTheme:
      purpose: Sets themeChoice to ThemeChoice.values[index].
      params: [emit, index]
      test: index 2 -> dark.

  values:
    showOnboarding:
      purpose: >-
        True while onboarded is false.
      returns: bool
      test: >-
        initial -> true.
    onboardingIcon:
      purpose: >-
        Step icon - 0 sparkle, 1 location, 2 star.
      returns: String
      test: >-
        step 1 -> location.
    onboardingTitle:
      purpose: >-
        welcomeTitle, storeStepTitle or rewardsStepTitle by onboardingStep.
      returns: String
      params: [labels]
      test: >-
        step 0 -> welcomeTitle text.
