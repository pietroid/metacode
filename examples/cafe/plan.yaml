  shared:
    formatMoney:
      purpose: 4.5 -> "$4.50" (two decimals, no thousands separator needed).
      signature: String formatMoney(num amount)
      in: values
    linePrice:
      purpose: >-
        The price of a cart line - (item price + size delta (small -0.50,
        medium 0, large +0.70) + 0.70 for oat or almond + 0.80 per shot) x
        quantity; non-customizable items are price x quantity. The item is
        found by id in the menu.
      signature: num linePrice(List<MenuItem> menu, CartLine line)
      in: values

  tests:
    menuTab: {state: {onboarded: true}}
    menuSearchEmpty: {state: {onboarded: true, search: zzz}}
    onboardingStore: {state: {onboardingStep: 1}}
    onboardingRewards: {state: {onboardingStep: 2, rewardsOn: true}}
    rewardsTab: {state: {onboarded: true, currentTab: rewards, rewardsOn: true, lastRedeemed: Free drink}}
    rewardsOff: {state: {onboarded: true, currentTab: rewards}}
    ordersTab: {state: {onboarded: true, currentTab: orders}}
    ordersEmpty: {state: {onboarded: true, currentTab: orders, orders: []}}
    profileTab: {state: {onboarded: true, currentTab: profile}}
    itemBakery: {state: {onboarded: true, selectedItem: 10}, route: item}
    cartEmpty: {state: {onboarded: true, cart: []}, route: cart}
    orderPreparing: {state: {onboarded: true, orders: [{number: 1043, lines: [{itemId: latte, size: large, milk: oat, shots: 1, quantity: 1}], total: 6.7, store: 0, pickup: now, payment: card, status: preparing, placedAt: Just now}]}, route: order}
