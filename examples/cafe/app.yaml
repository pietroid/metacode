# cafe: Ember & Oak, a neighborhood coffee shop ordering app. A short onboarding on first launch (welcome, pick a favorite store, turn on rewards; skippable), then four bottom tabs: Menu (category chips over a grid of colorful item tiles, search by name, a floating cart bar), Rewards (a stars card, 1 star per dollar, 150 stars = a free drink, and the rewards to redeem), Orders (history) and Profile. Tapping an item opens a detail page to pick size, milk, extra shots and quantity with a live price, then add it to the cart (a bottom sheet with steppers). Checkout picks the pickup store (a dialog), time and payment, and placing an order opens its status page, which advances placed -> preparing -> ready on its own. Local state only, no backend, no real payments. Warm, cozy and premium; must look good on a phone and on desktop (wide layouts center content with a max width, the menu grid gets more columns, the item page becomes two columns).
