# FavoritePickerRow: a store (name, address, distance) with a check icon; tap makes it the favorite.
FavoritePickerRow:
  tappable:
    onTap: pickFavorite
    child:
      padding:
        vertical: 8
        child:
          row:
            spacing: 12
            crossAxisAlignment: center
            children:
              - expanded:
                  column:
                    crossAxisAlignment: start
                    spacing: 2
                    children:
                      - text: {value: storeName, style: {variant: titleMedium}}
                      - text: {value: storeAddress, style: {variant: bodySmall, color: ink2}}
                      - text: {value: storeDistance, style: {variant: bodySmall, color: ink3}}
              - icon: {name: favoriteStoreIcon, color: favoriteStoreColor, size: 28}
