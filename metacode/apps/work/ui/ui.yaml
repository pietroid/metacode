# Freelance jobs and taxes. Embedded in the landing page's examples carousel
# (`app: work`).

widgets:
  homePage:
    column:
      crossAxisAlignment: stretch
      spacing: 10
      children:
        - text: {value: "November", style: {variant: titleLarge}}
        - row:
            spacing: 12
            children:
              - expanded:
                  column:
                    crossAxisAlignment: start
                    children:
                      - text: {value: "Received", style: {variant: bodySmall, color: ink3}}
                      - text: {value: receivedText, style: {variant: headlineSmall, color: success}}
              - expanded:
                  column:
                    crossAxisAlignment: start
                    children:
                      - text: {value: "Waiting", style: {variant: bodySmall, color: ink3}}
                      - text: {value: waitingText, style: {variant: headlineSmall}}
        - tip
        - text: {value: taxText, style: {variant: bodySmall, color: ink2}}
        - slider: {value: taxRateValue, min: 0, max: 30, divisions: 30, onChanged: setTaxRate}
        - listView: {data: jobList, itemBuilder: jobRow}

  tip:
    container:
      color: fill
      radius: 12
      padding: 12
      child:
        row:
          spacing: 10
          crossAxisAlignment: start
          children:
            - icon: {name: sparkle, size: 18, color: primary}
            - expanded: {text: {value: workTip, style: {variant: bodySmall}}}

  jobRow:
    padding:
      vertical: 2
      child:
        row:
          spacing: 8
          children:
            - checkbox: {value: jobPaid, onChanged: toggleJobPaid}
            - expanded:
                column:
                  crossAxisAlignment: start
                  children:
                    - text: {value: jobClient, style: {variant: titleSmall}}
                    - text: {value: jobTask, style: {variant: bodySmall, color: ink3}}
            - text: {value: jobAmount, style: {variant: labelLarge, color: ink2}}
