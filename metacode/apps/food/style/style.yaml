# Food tracker: a sophisticated, editorial look. Playfair Display headlines
# over Source Sans 3 body text, with warm earthy tones and fully rounded,
# organic controls. Fonts are loaded from Google Fonts at runtime.

fonts: {display: Playfair Display, text: Source Sans 3}
icons: {weight: regular}

colors:
  light:
    bg: "#F8F5F0"
    surface: "#FFFDF9"
    fill: "#F0EBE3"
    fillStrong: "#E6DED3"
    line: "#E8E0D5"
    lineStrong: "#D4C8B8"
    ink: "#2A2118"
    ink2: "#6B5E4F"
    ink3: "#A89B8C"
    primary: "#5A4A3A"
    onPrimary: "#FFFDF9"
    accent: "#B85C38"
    onAccent: "#FFFDF9"
    success: "#4A6C5A"
    warning: "#C78D36"
    danger: "#A94442"
    info: "#4A6B8A"
  dark:
    bg: "#1A1612"
    surface: "#242019"
    fill: "#2E2821"
    fillStrong: "#3A3229"
    line: "#3A3229"
    lineStrong: "#4E4439"
    ink: "#F5F0E8"
    ink2: "#B8AEA1"
    ink3: "#7D7368"
    primary: "#D4C4B0"
    onPrimary: "#1A1612"
    accent: "#E89B6F"
    onAccent: "#1A1612"
    success: "#7EB88F"
    warning: "#E5B867"
    danger: "#D97B78"
    info: "#8BB0CF"

radius: {xs: 6, sm: 999, md: 24, lg: 32, pill: 999}

spacing:
  s1: 4
  s2: 8
  s3: 12
  s4: 16
  s5: 20
  s6: 24
  s8: 32

sizes:
  control: 48
  icon: 22
  border: 1

typography:
  titleLarge: {font: display, size: 24, weight: 600, height: 1.2, tracking: -0.02}
  titleSmall: {font: display, size: 16, weight: 500, height: 1.35, tracking: -0.01}
  labelLarge: {font: text, size: 15, weight: 600, height: 1.25, tracking: -0.002}
