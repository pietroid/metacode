# My Own App: the website. One scrolling page (hero with a live "make my
# app" demo, a ticker, example apps, how it works, ideas, waitlist) plus a
# waitlist bottom sheet. Page columns cap at 1120 and center on wide screens.
#
# ui/ is split by section; all files share one widget namespace:
# hero.yaml, examples.yaml, sections.yaml (ticker, how it works, ideas),
# waitlist.yaml (section + the bottom sheet route).

widgets:
  homePage:
    scaffold:
      appBar:
        title: logo
        actions:
          - padding:
              right: 16
              child:
                outlinedButton: {text: "Join waitlist", onPressed: openWaitlist}
      body:
        scroll:
          column:
            crossAxisAlignment: stretch
            children:
              - hero
              - ticker
              - examples
              - howItWorks
              - ideas
              - waitlistSection
              - footer

  logo:
    row:
      spacing: 12
      children:
        - image: {src: "metacode/assets/logo.svg", width: 17, height: 26}
        - text: {value: "MY OWN APP", style: {variant: labelLarge, fontWeight: w800}}

  footer:
    column:
      crossAxisAlignment: stretch
      children:
        - divider: {height: 1}
        - container:
            maxWidth: 1120
            padding: {horizontal: 24, top: 32, bottom: 48}
            child:
              row:
                children:
                  - row:
                      spacing: 10
                      children:
                        - image: {src: "metacode/assets/logo.svg", width: 11, height: 16}
                        - text: {value: "MY OWN APP", style: {variant: labelSmall, color: ink3}}
                  - spacer: {}
                  - text: {value: "© 2026 My Own App", style: {variant: bodySmall, color: ink3}}
