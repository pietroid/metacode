# UI definition. Each key under `widgets` is a widget identifier that the
# engine can render. Bindings are Dart functions in the `bindings/` package;
# actions are Dart functions in the `actions/` package.

widgets:
  homePage:
    scaffold:
      appBar:
        title: pageTitle
      body:
        match:
          value: currentPage
          cases:
            finances: financesPage
            goals: goalsPage
            menu: menuPage
      bottomBar:
        navigationBar:
          destinations:
            - {icon: wallet, label: Finances}
            - {icon: flag, label: Goals}
            - {icon: menu, label: Menu}
          selected: pageIndex
          onSelected: goToPage

  # ---------- Finances ----------

  financesPage:
    column:
      crossAxisAlignment: stretch
      children:
        - balanceCard
        - entryForm
        - padding:
            left: 16
            right: 16
            top: 24
            bottom: 4
            child:
              text: {value: "Transactions", style: {variant: titleMedium}}
        - expanded:
            listView:
              data: entryList
              itemBuilder: entryTile
              empty: entriesEmpty

  balanceCard:
    padding:
      left: 16
      right: 16
      top: 20
      bottom: 20
      child:
        column:
          crossAxisAlignment: start
          spacing: 6
          children:
            - text: {value: "Balance", style: {variant: labelMedium, color: ink2}}
            - text: {value: balanceText, style: {variant: displaySmall}}
            - row:
                spacing: 20
                children:
                  - row:
                      spacing: 6
                      children:
                        - icon: {name: trendingUp, size: 16, color: success}
                        - text: {value: incomeText, style: {variant: labelLarge, color: ink2}}
                  - row:
                      spacing: 6
                      children:
                        - icon: {name: payment, size: 16, color: danger}
                        - text: {value: expenseText, style: {variant: labelLarge, color: ink2}}

  entryForm:
    padding:
      horizontal: 16
      top: 8
      child:
        card:
          child:
            column:
              crossAxisAlignment: stretch
              spacing: 8
              children:
                - textField: {value: entryTitleValue, label: "Description", onChanged: updateEntryTitle}
                - textField: {value: entryAmountValue, label: "Amount", onChanged: updateEntryAmount}
                - row:
                    spacing: 8
                    children:
                      - choiceChip: {label: "Income", selected: kindIsIncome, onSelected: selectIncome}
                      - choiceChip: {label: "Expense", selected: kindIsExpense, onSelected: selectExpense}
                      - spacer: {}
                      - filledButton: {text: "Add", icon: add, onPressed: addEntry}

  entryTile:
    column:
      crossAxisAlignment: stretch
      children:
        - padding:
            left: 16
            right: 4
            vertical: 6
            child:
              row:
                spacing: 14
                children:
                  - if:
                      condition: entryIsIncome
                      then: {icon: {name: trendingUp, color: success}}
                      else: {icon: {name: payment, color: danger}}
                  - expanded:
                      column:
                        crossAxisAlignment: start
                        spacing: 2
                        children:
                          - text: {value: entryTitleAt, style: {variant: titleSmall}, maxLines: 1}
                          - text: {value: entryDateAt, style: {variant: bodySmall}}
                  - text: {value: entryAmountAt, style: {variant: titleSmall}}
                  - iconButton: {icon: delete, tooltip: "Delete", color: ink3, onPressed: deleteEntry}
        - padding:
            left: 50
            child:
              divider: {height: 1}

  entriesEmpty:
    center:
      padding:
        all: 32
        child:
          column:
            spacing: 8
            children:
              - icon: {name: wallet, size: 32, color: ink3}
              - text: {value: "No transactions yet", style: {variant: bodyMedium, color: ink2}}

  # ---------- Goals ----------

  goalsPage:
    column:
      - goalForm
      - padding:
          horizontal: 16
          top: 24
          bottom: 8
          child:
            row:
              spacing: 12
              crossAxisAlignment: end
              children:
                - expanded:
                    padding:
                      bottom: 12
                      child:
                        text: {value: "Your goals", style: {variant: titleMedium}}
                - sizedBox:
                    width: 140
                    child:
                      textField: {value: contributionValue, label: "Add per tap", onChanged: updateContribution}
      - expanded:
          listView:
            data: goalList
            itemBuilder: goalTile
            empty: goalsEmpty

  goalForm:
    padding:
      horizontal: 16
      top: 16
      child:
        card:
          child:
            column:
              crossAxisAlignment: stretch
              spacing: 8
              children:
                - textField: {value: goalNameValue, label: "Goal name", onChanged: updateGoalName}
                - row:
                    spacing: 8
                    children:
                      - expanded:
                          textField: {value: goalTargetValue, label: "Target amount", onChanged: updateGoalTarget}
                      - filledButton: {text: "Add goal", icon: add, onPressed: addGoal}

  goalTile:
    padding:
      horizontal: 16
      vertical: 4
      child:
        card:
          child:
            column:
              crossAxisAlignment: stretch
              spacing: 8
              children:
                - row:
                    spacing: 8
                    children:
                      - if:
                          condition: goalReachedAt
                          then: {icon: {name: checkCircle, color: success}}
                          else: {icon: {name: flag, color: ink2}}
                      - expanded:
                          text: {value: goalNameAt, style: {variant: titleMedium}}
                      - text: {value: goalPercentAt, style: {variant: labelLarge, color: ink2}}
                      - iconButton: {icon: delete, tooltip: "Delete goal", color: ink3, onPressed: deleteGoal}
                - progress: {value: goalProgressAt}
                - row:
                    children:
                      - expanded:
                          text: {value: goalAmountsAt, style: {variant: bodyMedium, color: onSurfaceVariant}}
                      - textButton: {text: contributionLabel, icon: add, onPressed: contributeToGoal}

  goalsEmpty:
    center:
      padding:
        all: 32
        child:
          column:
            spacing: 8
            children:
              - icon: {name: flag, size: 32, color: ink3}
              - text: {value: "No goals yet", style: {variant: bodyMedium, color: ink2}}

  # ---------- Menu ----------

  menuPage:
    scroll:
      padding:
        all: 16
        child:
          column:
            crossAxisAlignment: stretch
            spacing: 12
            children:
              - profileHeader
              - card:
                  child:
                    column:
                      crossAxisAlignment: stretch
                      spacing: 8
                      children:
                        - text: {value: "Profile", style: {variant: titleMedium}}
                        - textField: {value: profileName, label: "Name", onChanged: updateProfileName}
                        - textField: {value: profileEmail, label: "Email", onChanged: updateProfileEmail}
              - card:
                  child:
                    column:
                      crossAxisAlignment: stretch
                      spacing: 8
                      children:
                        - text: {value: "Preferences", style: {variant: titleMedium}}
                        - row:
                            children:
                              - expanded:
                                  text: "Currency"
                              - sizedBox:
                                  width: 100
                                  child:
                                    dropdown: {value: profileCurrency, options: currencyOptions, onChanged: updateCurrency}
                        - toggle: {value: notificationsOn, label: "Notifications", onChanged: toggleNotifications}
              - card:
                  child:
                    column:
                      crossAxisAlignment: stretch
                      children:
                        - text: {value: "Summary", style: {variant: titleMedium}}
                        - listTile: {leading: {icon: {name: list}}, title: "Transactions", trailing: entryCountText}
                        - listTile: {leading: {icon: {name: flag}}, title: "Goals", trailing: goalCountText}
                        - listTile: {leading: {icon: {name: wallet}}, title: "Balance", trailing: balanceText}
              - card:
                  child:
                    listTile: {leading: {icon: {name: coins}}, title: "Dollar rate", subtitle: "USD to BRL, live", trailing: {icon: {name: chevronRight}}, onTap: openDollarRate}
              - outlinedButton: {text: "Reset all data", icon: delete, onPressed: askResetData}

  profileHeader:
    column:
      spacing: 8
      children:
        - avatar: {text: profileInitials, radius: 36}
        - text: {value: profileName, style: {variant: titleLarge}}
        - text: {value: profileEmail, style: {variant: bodySmall}}

  # ---------- Routes (navigation.yaml) ----------

  dollarRateSheet:
    padding:
      left: 24
      right: 24
      bottom: 24
      child:
        column:
          crossAxisAlignment: stretch
          spacing: 12
          children:
            - text: {value: "Dollar rate", style: {variant: titleLarge}}
            - text: {value: dollarRateText, style: {variant: displaySmall}}
            - text: {value: dollarRateUpdatedText, style: {variant: bodySmall, color: ink2}}
            - if: {condition: dollarRateLoading, then: {progress: {}}}
            - filledButton: {text: "Refresh", icon: refresh, onPressed: fetchDollarRate}
            - textButton: {text: "Close", onPressed: close}

  confirmResetDialog:
    padding:
      all: 24
      child:
        column:
          crossAxisAlignment: stretch
          spacing: 12
          children:
            - text: {value: "Reset all data?", style: {variant: titleLarge}}
            - text: {value: "This deletes every transaction and goal.", style: {variant: bodyMedium, color: ink2}}
            - row:
                mainAxisAlignment: end
                spacing: 8
                children:
                  - textButton: {text: "Cancel", onPressed: close}
                  - filledButton: {text: "Reset", icon: delete, onPressed: resetData}
