# My Own App: the website. One scrolling page (hero with a live "make my
# app" demo, a ticker, example apps, how it works, ideas, waitlist) plus a
# waitlist bottom sheet. Page columns cap at 1120 and center on wide screens.

widgets:
  homePage:
    scaffold:
      appBar:
        title: logo
        actions:
          - padding:
              right: 16
              child:
                outlinedButton: {text: "Join waitlist", onPressed: openWaitlist}
      body:
        scroll:
          column:
            crossAxisAlignment: stretch
            children:
              - hero
              - ticker
              - examples
              - howItWorks
              - ideas
              - waitlistSection
              - footer

  # ---------- Brand ----------

  logo:
    row:
      spacing: 12
      children:
        - image: {src: "metacode/assets/logo.svg", width: 17, height: 26}
        - text: {value: "MY OWN APP", style: {variant: labelLarge, fontWeight: w800}}

  # ---------- Hero ----------

  hero:
    container:
      maxWidth: 1120
      padding: {horizontal: 24, top: 96, bottom: 8}
      child:
        column:
          spacing: 28
          children:
            - heroTitle
            - container:
                maxWidth: 560
                child:
                  text:
                    value: "My Own App uses AI to build an app made just for you, in a few minutes. No tech skills needed. If you want it different, just ask."
                    style: {variant: bodyLarge, color: ink2}
                    align: center
            - sizedBox: {height: 20}
            - tryCard
            - ideaChips

  heroTitle:
    responsive:
      breakpoint: 760
      narrow:
        text:
          spans: ["Say what you need. Get your ", {value: "own app.", style: {color: primary}}]
          style: {variant: displayMedium}
          align: center
      wide:
        container:
          maxWidth: 820
          child:
            text:
              spans: ["Say what you need. Get your ", {value: "own app.", style: {color: primary}}]
              style: {variant: displayLarge}
              align: center

  tryCard:
    container:
      maxWidth: 760
      color: surface
      borderColor: line
      radius: 20
      child:
        column:
          crossAxisAlignment: stretch
          children:
            - padding:
                left: 24
                right: 16
                top: 24
                bottom: 20
                child:
                  column:
                    crossAxisAlignment: stretch
                    spacing: 14
                    children:
                      - text: {value: "What would make your day easier?", style: {variant: labelMedium, color: ink3}}
                      - textField: {value: ideaValue, hint: "Remind me to water my plants", onChanged: updateIdea, onSubmitted: makeApp}
                      - filledButton: {text: makeButtonText, onPressed: makeApp}
            - divider: {height: 1}
            - padding:
                horizontal: 24
                vertical: 24
                child:
                  column:
                    crossAxisAlignment: stretch
                    spacing: 18
                    children:
                      - step1
                      - step2
                      - step3
                      - step4
            - if:
                condition: buildReady
                then: readyBar

  step1:
    row:
      spacing: 12
      children:
        - match: {value: step1State, cases: {done: stepDone, doing: stepDoing}, default: stepTodo}
        - expanded: {text: {value: "Understanding what you need", style: {variant: bodyMedium}}}
  step2:
    row:
      spacing: 12
      children:
        - match: {value: step2State, cases: {done: stepDone, doing: stepDoing}, default: stepTodo}
        - expanded: {text: {value: "Designing your screens", style: {variant: bodyMedium}}}
  step3:
    row:
      spacing: 12
      children:
        - match: {value: step3State, cases: {done: stepDone, doing: stepDoing}, default: stepTodo}
        - expanded: {text: {value: "Setting up your lists and reminders", style: {variant: bodyMedium}}}
  step4:
    row:
      spacing: 12
      children:
        - match: {value: step4State, cases: {done: stepDone, doing: stepDoing}, default: stepTodo}
        - expanded: {text: {value: "Putting it on your phone", style: {variant: bodyMedium}}}

  stepTodo:
    container: {width: 22, height: 22, radius: 11, borderColor: lineStrong}
  stepDoing:
    sizedBox:
      width: 22
      height: 22
      child:
        padding: {all: 2, child: {progress: {circular: true}}}
  stepDone:
    container:
      width: 22
      height: 22
      radius: 11
      color: success
      child:
        center: {icon: {name: check, size: 13, color: bg}}

  readyBar:
    container:
      color: fill
      padding: {left: 24, right: 16, vertical: 14}
      child:
        row:
          spacing: 10
          children:
            - icon: {name: confetti, size: 20, color: primary}
            - expanded:
                text:
                  spans: ["Your app is ready", {value: "  in 2 minutes", style: {color: ink3, fontWeight: w500}}]
                  style: {variant: titleSmall}
            - outlinedButton: {text: "Get early access", onPressed: openWaitlist}

  ideaChips:
    container:
      maxWidth: 760
      child:
        wrap:
          alignment: center
          spacing: 10
          runSpacing: 10
          children:
            - choiceChip: {label: "Track my daily habits", selected: ideaIsHabits, onSelected: pickHabits}
            - choiceChip: {label: "Plan meals for the week", selected: ideaIsMeals, onSelected: pickMeals}
            - choiceChip: {label: "Split bills with roommates", selected: ideaIsBills, onSelected: pickBills}
            - choiceChip: {label: "Keep my book list", selected: ideaIsBooks, onSelected: pickBooks}

  # ---------- Ticker ----------

  ticker:
    padding:
      top: 112
      child:
        column:
          crossAxisAlignment: stretch
          children:
            - divider: {height: 1}
            - padding:
                vertical: 20
                child:
                  marquee:
                    spacing: 52
                    children:
                      - text: {spans: [{value: "Ana", style: {color: ink2, fontWeight: w600}}, " made a plant reminder app"], style: {variant: bodyMedium, color: ink3}}
                      - text: {spans: [{value: "Leo", style: {color: ink2, fontWeight: w600}}, " made a weekly meal planner"], style: {variant: bodyMedium, color: ink3}}
                      - text: {spans: [{value: "Mia", style: {color: ink2, fontWeight: w600}}, " made a running club tracker"], style: {variant: bodyMedium, color: ink3}}
                      - text: {spans: [{value: "Raj", style: {color: ink2, fontWeight: w600}}, " made a bill splitter"], style: {variant: bodyMedium, color: ink3}}
                      - text: {spans: [{value: "Sam", style: {color: ink2, fontWeight: w600}}, " made a reading list"], style: {variant: bodyMedium, color: ink3}}
                      - text: {spans: [{value: "Kai", style: {color: ink2, fontWeight: w600}}, " made a gig calendar"], style: {variant: bodyMedium, color: ink3}}
                      - text: {spans: [{value: "Lu", style: {color: ink2, fontWeight: w600}}, " made a baby sleep log"], style: {variant: bodyMedium, color: ink3}}
            - divider: {height: 1}

  # ---------- Examples (a carousel of four working mini apps) ----------

  examples:
    container:
      maxWidth: 1120
      padding: {horizontal: 24, top: 128}
      child:
        column:
          crossAxisAlignment: stretch
          spacing: 16
          children:
            - text: {value: "EXAMPLES", style: {variant: labelSmall, color: accent}}
            - text: {value: "One sentence. One app.", style: {variant: headlineLarge}}
            - text: {value: "Each of these started with someone saying what they needed. Go ahead and tap around, they work.", style: {variant: bodyMedium, color: ink2}}
            - sizedBox: {height: 16}
            - carouselNav
            - sizedBox: {height: 24}
            - exampleSlide

  carouselNav:
    row:
      spacing: 8
      children:
        - iconButton: {icon: chevronLeft, tooltip: "Previous", onPressed: previousExample}
        - expanded:
            wrap:
              alignment: center
              spacing: 8
              runSpacing: 8
              children:
                - choiceChip: {label: "Food", selected: exampleIsFood, onSelected: showFood}
                - choiceChip: {label: "Music", selected: exampleIsMusic, onSelected: showMusic}
                - choiceChip: {label: "Work", selected: exampleIsWork, onSelected: showWork}
                - choiceChip: {label: "Plants", selected: exampleIsPlants, onSelected: showPlants}
        - iconButton: {icon: chevronRight, tooltip: "Next", onPressed: nextExample}

  exampleSlide:
    responsive:
      breakpoint: 860
      narrow:
        column:
          crossAxisAlignment: stretch
          spacing: 32
          children: [exampleCopy, examplePhone]
      wide:
        row:
          crossAxisAlignment: center
          spacing: 64
          children:
            - expanded: exampleCopy
            - sizedBox: {width: 400, child: examplePhone}

  exampleCopy:
    column:
      crossAxisAlignment: start
      spacing: 14
      children:
        - text: {value: exampleTag, style: {variant: labelSmall, color: ink3}}
        - text: {value: examplePrompt, style: {variant: headlineMedium}}
        - text: {value: exampleBlurb, style: {variant: bodyLarge, color: ink2}}
        - sizedBox: {height: 8}
        - row:
            spacing: 16
            children:
              - filledButton: {text: "Make one like this", onPressed: makeLikeThis}
              - text: {value: examplePosition, style: {variant: bodySmall, color: ink3}}

  examplePhone:
    center:
      container:
        maxWidth: 400
        color: surface
        borderColor: line
        radius: 28
        padding: 12
        child:
          column:
            crossAxisAlignment: stretch
            spacing: 4
            children:
              - image: {src: exampleImage, height: 150, fit: cover, radius: 18}
              - padding:
                  horizontal: 8
                  top: 12
                  bottom: 4
                  child:
                    match:
                      value: exampleKey
                      cases: {food: foodApp, music: musicApp, work: workApp, plants: plantsApp}

  # ----- Food -----

  foodApp:
    column:
      crossAxisAlignment: stretch
      spacing: 10
      children:
        - row:
            children:
              - expanded: {text: {value: "Today", style: {variant: titleLarge}}}
              - textButton: {text: "Clear", onPressed: clearFoods}
        - text: {value: caloriesText, style: {variant: titleSmall}}
        - progress: {value: caloriesProgress}
        - text: {value: proteinText, style: {variant: bodySmall, color: ink3}}
        - tipBox
        - listView: {data: foodList, itemBuilder: foodRow}

  tipBox:
    container:
      color: fill
      radius: 12
      padding: 12
      child:
        row:
          spacing: 10
          crossAxisAlignment: start
          children:
            - icon: {name: sparkle, size: 18, color: primary}
            - expanded: {match: {value: exampleKey, cases: {food: foodTipText, music: musicTipText, work: workTipText, plants: plantTipText}}}

  foodTipText: {text: {value: foodTip, style: {variant: bodySmall}}}
  musicTipText: {text: {value: musicTip, style: {variant: bodySmall}}}
  workTipText: {text: {value: workTip, style: {variant: bodySmall}}}
  plantTipText: {text: {value: plantTip, style: {variant: bodySmall}}}

  foodRow:
    padding:
      vertical: 2
      child:
        row:
          spacing: 4
          children:
            - expanded:
                column:
                  crossAxisAlignment: start
                  children:
                    - text: {value: foodName, style: {variant: titleSmall}}
                    - text: {value: foodInfo, style: {variant: bodySmall, color: ink3}}
            - iconButton: {icon: remove, tooltip: "Remove one", onPressed: removeFood}
            - sizedBox: {width: 20, child: {text: {value: foodCount, style: {variant: labelLarge}, align: center}}}
            - iconButton: {icon: add, tooltip: "Add one", onPressed: addFood}

  # ----- Music -----

  musicApp:
    column:
      crossAxisAlignment: stretch
      spacing: 10
      children:
        - text: {value: "Guitar basics", style: {variant: titleLarge}}
        - text: {value: chordsText, style: {variant: titleSmall}}
        - progress: {value: chordsProgress}
        - tipBox
        - row:
            spacing: 12
            children:
              - expanded:
                  column:
                    crossAxisAlignment: stretch
                    spacing: 6
                    children:
                      - text: {value: practiceText, style: {variant: bodySmall, color: ink2}}
                      - progress: {value: practiceProgress}
              - outlinedButton: {text: "+5 min", icon: timer, onPressed: logPractice}
        - listView: {data: chordList, itemBuilder: chordRow}

  chordRow:
    padding:
      vertical: 4
      child:
        row:
          spacing: 12
          children:
            - container:
                width: 40
                height: 40
                radius: 10
                color: fill
                child: {center: {text: {value: chordName, style: {variant: titleSmall}}}}
            - expanded: {text: {value: chordFingers, style: {variant: bodySmall, color: ink2}}}
            - checkbox: {value: chordLearned, onChanged: toggleChord}

  # ----- Work -----

  workApp:
    column:
      crossAxisAlignment: stretch
      spacing: 10
      children:
        - text: {value: "November", style: {variant: titleLarge}}
        - row:
            spacing: 12
            children:
              - expanded:
                  column:
                    crossAxisAlignment: start
                    children:
                      - text: {value: "Received", style: {variant: bodySmall, color: ink3}}
                      - text: {value: receivedText, style: {variant: headlineSmall, color: success}}
              - expanded:
                  column:
                    crossAxisAlignment: start
                    children:
                      - text: {value: "Waiting", style: {variant: bodySmall, color: ink3}}
                      - text: {value: waitingText, style: {variant: headlineSmall}}
        - tipBox
        - text: {value: taxText, style: {variant: bodySmall, color: ink2}}
        - slider: {value: taxRateValue, min: 0, max: 30, divisions: 30, onChanged: setTaxRate}
        - listView: {data: jobList, itemBuilder: jobRow}

  jobRow:
    padding:
      vertical: 2
      child:
        row:
          spacing: 8
          children:
            - checkbox: {value: jobPaid, onChanged: toggleJobPaid}
            - expanded:
                column:
                  crossAxisAlignment: start
                  children:
                    - text: {value: jobClient, style: {variant: titleSmall}}
                    - text: {value: jobTask, style: {variant: bodySmall, color: ink3}}
            - text: {value: jobAmount, style: {variant: labelLarge, color: ink2}}

  # ----- Plants -----

  plantsApp:
    column:
      crossAxisAlignment: stretch
      spacing: 10
      children:
        - row:
            children:
              - expanded: {text: {value: "Plant care", style: {variant: titleLarge}}}
              - textButton: {text: "Next day", icon: arrowForward, onPressed: nextDay}
        - text: {value: plantsText, style: {variant: titleSmall}}
        - tipBox
        - listView: {data: plantList, itemBuilder: plantRow}

  plantRow:
    padding:
      vertical: 2
      child:
        row:
          spacing: 8
          children:
            - expanded:
                column:
                  crossAxisAlignment: start
                  children:
                    - text: {value: plantName, style: {variant: titleSmall}}
                    - text: {value: plantSchedule, style: {variant: bodySmall, color: ink3}}
            - text: {value: plantStatus, style: {variant: labelMedium, color: ink2}}
            - iconButton: {icon: drop, tooltip: "Watered", color: primary, onPressed: waterPlant}

  # ---------- How it works ----------

  howItWorks:
    container:
      maxWidth: 1120
      padding: {horizontal: 24, top: 128}
      child:
        responsive:
          breakpoint: 860
          narrow:
            column:
              crossAxisAlignment: stretch
              spacing: 40
              children: [howHeading, howList]
          wide:
            row:
              crossAxisAlignment: start
              spacing: 72
              children:
                - expanded: {flex: 10, child: howHeading}
                - expanded: {flex: 13, child: howList}

  howHeading:
    column:
      crossAxisAlignment: start
      spacing: 16
      children:
        - text: {value: "HOW IT WORKS", style: {variant: labelSmall, color: accent}}
        - text: {value: "As easy as sending a message.", style: {variant: headlineLarge}}

  howList:
    column:
      crossAxisAlignment: stretch
      children:
        - divider: {height: 1}
        - howStep1
        - divider: {height: 1}
        - howStep2
        - divider: {height: 1}
        - howStep3
        - divider: {height: 1}
        - howStep4
        - divider: {height: 1}

  howStep1:
    padding: {vertical: 28, child: {row: {spacing: 20, crossAxisAlignment: start, children: [{container: {width: 36, height: 36, radius: 10, borderColor: lineStrong, child: {center: {text: {value: "1", style: {variant: labelLarge, color: ink2}}}}}}, {expanded: {column: {crossAxisAlignment: start, spacing: 8, children: [{text: {value: "Tell it what you need", style: {variant: titleLarge}}}, {text: {value: "In your own words, the way you'd explain it to a friend.", style: {variant: bodyMedium, color: ink2}}}]}}}]}}}
  howStep2:
    padding: {vertical: 28, child: {row: {spacing: 20, crossAxisAlignment: start, children: [{container: {width: 36, height: 36, radius: 10, borderColor: lineStrong, child: {center: {text: {value: "2", style: {variant: labelLarge, color: ink2}}}}}}, {expanded: {column: {crossAxisAlignment: start, spacing: 6, children: [{text: {value: "Watch it come together", style: {variant: titleLarge}}}, {text: {value: "In a few minutes, your app is ready, with the screens and lists that fit your life.", style: {variant: bodyMedium, color: ink2}}}]}}}]}}}
  howStep3:
    padding: {vertical: 28, child: {row: {spacing: 20, crossAxisAlignment: start, children: [{container: {width: 36, height: 36, radius: 10, borderColor: lineStrong, child: {center: {text: {value: "3", style: {variant: labelLarge, color: ink2}}}}}}, {expanded: {column: {crossAxisAlignment: start, spacing: 6, children: [{text: {value: "Use it every day", style: {variant: titleLarge}}}, {text: {value: "It's a real app on your phone, not a demo.", style: {variant: bodyMedium, color: ink2}}}]}}}]}}}
  howStep4:
    padding: {vertical: 28, child: {row: {spacing: 20, crossAxisAlignment: start, children: [{container: {width: 36, height: 36, radius: 10, borderColor: lineStrong, child: {center: {text: {value: "4", style: {variant: labelLarge, color: ink2}}}}}}, {expanded: {column: {crossAxisAlignment: start, spacing: 6, children: [{text: {value: "Change it anytime", style: {variant: titleLarge}}}, {text: {value: "Want a photo for each plant, or a different look? Just ask and it updates.", style: {variant: bodyMedium, color: ink2}}}]}}}]}}}

  # ---------- Ideas ----------

  ideas:
    container:
      maxWidth: 1120
      padding: {horizontal: 24, top: 128}
      child:
        column:
          crossAxisAlignment: stretch
          spacing: 16
          children:
            - text: {value: "IDEAS", style: {variant: labelSmall, color: accent}}
            - text: {value: "Whatever you need, it can be an app.", style: {variant: headlineLarge}}
            - sizedBox: {height: 32}
            - wrap:
                alignment: center
                spacing: 16
                runSpacing: 16
                children: [useHome, useHealth, useWork, useHobbies]

  useHome:
    sizedBox: {width: 256, child: {container: {color: surface, borderColor: line, radius: 18, padding: 24, child: {column: {crossAxisAlignment: start, spacing: 8, children: [{container: {width: 40, height: 40, radius: 12, color: fill, child: {center: {icon: {name: home, size: 20, color: primary}}}}}, {sizedBox: {height: 22}}, {text: {value: "Home", style: {variant: titleMedium}}}, {text: {value: "Chores, bills, groceries, the plants nobody waters.", style: {variant: bodySmall, color: ink2}}}]}}}}}
  useHealth:
    sizedBox: {width: 256, child: {container: {color: surface, borderColor: line, radius: 18, padding: 24, child: {column: {crossAxisAlignment: start, spacing: 8, children: [{container: {width: 40, height: 40, radius: 12, color: fill, child: {center: {icon: {name: fitness, size: 20, color: primary}}}}}, {sizedBox: {height: 22}}, {text: {value: "Health", style: {variant: titleMedium}}}, {text: {value: "Habits, workouts, water, sleep. Tracked your way.", style: {variant: bodySmall, color: ink2}}}]}}}}}
  useWork:
    sizedBox: {width: 256, child: {container: {color: surface, borderColor: line, radius: 18, padding: 24, child: {column: {crossAxisAlignment: start, spacing: 8, children: [{container: {width: 40, height: 40, radius: 12, color: fill, child: {center: {icon: {name: work, size: 20, color: primary}}}}}, {sizedBox: {height: 22}}, {text: {value: "Work", style: {variant: titleMedium}}}, {text: {value: "Client lists, small shop orders, team check-ins.", style: {variant: bodySmall, color: ink2}}}]}}}}}
  useHobbies:
    sizedBox: {width: 256, child: {container: {color: surface, borderColor: line, radius: 18, padding: 24, child: {column: {crossAxisAlignment: start, spacing: 8, children: [{container: {width: 40, height: 40, radius: 12, color: fill, child: {center: {icon: {name: palette, size: 20, color: primary}}}}}, {sizedBox: {height: 22}}, {text: {value: "Hobbies", style: {variant: titleMedium}}}, {text: {value: "Reading lists, recipes, gig calendars, collections.", style: {variant: bodySmall, color: ink2}}}]}}}}}

  # ---------- Waitlist ----------

  waitlistSection:
    container:
      maxWidth: 1120
      padding: {horizontal: 24, top: 128, bottom: 80}
      child:
        container:
          color: surface
          borderColor: line
          radius: 24
          padding: {horizontal: 24, vertical: 72}
          child:
            column:
              spacing: 16
              children:
                - text: {value: "What will you make first?", style: {variant: headlineLarge}, align: center}
                - text: {value: "We're letting people in a few at a time. Save your spot.", style: {variant: bodyMedium, color: ink2}, align: center}
                - sizedBox: {height: 16}
                - container:
                    maxWidth: 460
                    child:
                      if:
                        condition: waitlistJoined
                        then:
                          text: {value: joinedText, style: {variant: titleSmall, color: success}, align: center}
                        else: waitlistInline
                - text: {value: waitlistCountText, style: {variant: bodySmall, color: ink3}, align: center}

  waitlistInline:
    column:
      crossAxisAlignment: stretch
      spacing: 10
      children:
        - textField: {value: emailValue, hint: "you@example.com", onChanged: updateEmail, onSubmitted: joinWaitlist}
        - if:
            condition: waitlistInvalid
            then: {text: {value: "That email doesn't look right.", style: {variant: bodySmall, color: danger}}}
        - filledButton: {text: "Join waitlist", onPressed: joinWaitlist}

  footer:
    column:
      crossAxisAlignment: stretch
      children:
        - divider: {height: 1}
        - container:
            maxWidth: 1120
            padding: {horizontal: 24, top: 32, bottom: 48}
            child:
              row:
                children:
                  - row:
                      spacing: 10
                      children:
                        - image: {src: "metacode/assets/logo.svg", width: 11, height: 16}
                        - text: {value: "MY OWN APP", style: {variant: labelSmall, color: ink3}}
                  - spacer: {}
                  - text: {value: "© 2026 My Own App", style: {variant: bodySmall, color: ink3}}

  # ---------- Routes (navigation.yaml) ----------

  waitlistSheet:
    padding:
      left: 24
      right: 24
      bottom: 24
      child:
        if:
          condition: waitlistJoined
          then: waitlistDone
          else: waitlistForm

  waitlistForm:
    column:
      crossAxisAlignment: stretch
      spacing: 12
      children:
        - text: {value: "Get early access", style: {variant: headlineSmall}}
        - text: {value: ideaSummary, style: {variant: bodyMedium, color: ink2}}
        - textField: {value: emailValue, label: "Email", hint: "you@example.com", onChanged: updateEmail, onSubmitted: joinWaitlist}
        - if:
            condition: waitlistInvalid
            then: {text: {value: "That email doesn't look right.", style: {variant: bodySmall, color: danger}}}
        - filledButton: {text: "Join waitlist", onPressed: joinWaitlist}
        - textButton: {text: "Not now", onPressed: close}

  waitlistDone:
    column:
      crossAxisAlignment: stretch
      spacing: 12
      children:
        - icon: {name: checkCircle, size: 40, color: success}
        - text: {value: "You're on the list", style: {variant: headlineSmall}, align: center}
        - text: {value: joinedText, style: {variant: bodyMedium, color: ink2}, align: center}
        - filledButton: {text: "Done", onPressed: close}
