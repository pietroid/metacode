# Models describe the shape of the data.
#
# Primitives: string, boolean, number, datetime. Lists: list(type).
# Optional fields end with `?`. A list of values declares an enum.
#
# `state` is reserved: it types the app state in state.yaml and becomes the
# `State` class that actions and bindings receive.

page:
  - finances
  - goals
  - menu

entryKind:
  - income
  - expense

fetchStatus:
  - idle
  - loading
  - loaded
  - failed

entry:
  title: string
  amount: number
  kind: entryKind
  date: datetime

goal:
  name: string
  target: number
  saved: number

profile:
  name: string
  email: string
  currency: string
  notifications: boolean

state:
  page: page
  entries: list(entry)
  goals: list(goal)
  profile: profile
  entryTitle: string
  entryAmount: string
  entryKind: entryKind
  goalName: string
  goalTarget: string
  contribution: string
  dollarRate: number
  dollarRateStatus: fetchStatus
  dollarRateUpdated: string
