# Design tokens for the app. Every widget is themed from these values, and
# ui.yaml can use the color names (`color: accent`). This file names every token
# of the Metacode style (packages/app_ui/lib/style.dart); any key left out
# falls back to it.
#
# Look: My Own App. Calm near-black, one orange, Plus Jakarta Sans.

theme: dark                # system | light | dark

# Bundled: Plus Jakarta Sans, Cormorant Garamond (serif), Newsreader (serif),
# Albert Sans, Hanken Grotesk, Schibsted Grotesk, Figtree, or system.
fonts:
  display: Plus Jakarta Sans   # headlines and large titles
  text: Plus Jakarta Sans      # body, titles, labels, buttons

icons:
  weight: regular          # thin | light | regular | bold (Phosphor)

colors:
  light:
    bg: "#FAFAF9"          # page
    surface: "#FFFFFF"     # cards, fields, nav bar, menus
    fill: "#F2F2F0"        # chips, avatars, quiet containers
    fillStrong: "#E7E7E4"  # tracks, pressed states
    line: "#E7E7E4"        # hairlines
    lineStrong: "#D4D4D0"  # control borders
    ink: "#0A0A0A"         # text
    ink2: "#5C5C59"        # secondary text
    ink3: "#9A9A96"        # placeholders, idle icons
    primary: "#FF5A1F"     # main action
    onPrimary: "#FFFFFF"
    accent: "#E8490F"      # progress, caret, highlights
    onAccent: "#FFFFFF"
    success: "#16A36A"
    warning: "#B86E0A"
    danger: "#D23B2F"
    info: "#3B6797"
  dark:
    bg: "#0A0A0A"
    surface: "#121212"
    fill: "#181818"
    fillStrong: "#222222"
    line: "#222222"
    lineStrong: "#2E2E2E"
    ink: "#F5F5F4"
    ink2: "#A3A3A0"
    ink3: "#6B6B68"
    primary: "#FF5A1F"
    onPrimary: "#FFFFFF"
    accent: "#FF7A45"
    onAccent: "#0A0A0A"
    success: "#4ADE9B"
    warning: "#F2B154"
    danger: "#F27A6E"
    info: "#86ABDB"

radius: {xs: 4, sm: 10, md: 18, lg: 24, pill: 999}

spacing: {s1: 4, s2: 8, s3: 12, s4: 16, s5: 20, s6: 24, s8: 32}

sizes: {control: 44, icon: 22, border: 1}

# One entry per text variant (ui.yaml `text.style.variant`).
# font: display | text · weight: 400-800 · height: × size · tracking: × size
typography:
  displayLarge:   {font: display, size: 80, weight: 600, height: 1.0,  tracking: -0.045}
  displayMedium:  {font: display, size: 46, weight: 600, height: 1.04, tracking: -0.04}
  displaySmall:   {font: display, size: 36, weight: 600, height: 1.08, tracking: -0.035}
  headlineLarge:  {font: display, size: 44, weight: 700, height: 1.06, tracking: -0.04}
  headlineMedium: {font: display, size: 32, weight: 700, height: 1.1,  tracking: -0.035}
  headlineSmall:  {font: display, size: 22, weight: 700, height: 1.2,  tracking: -0.02}
  titleLarge:     {font: display, size: 20, weight: 700, height: 1.3,  tracking: -0.02}
  titleMedium:    {font: text,    size: 17, weight: 700, height: 1.35, tracking: -0.01}
  titleSmall:     {font: text,    size: 15, weight: 600, height: 1.4,  tracking: -0.005}
  bodyLarge:      {font: text,    size: 19, weight: 400, height: 1.55, tracking: 0}
  bodyMedium:     {font: text,    size: 15, weight: 400, height: 1.55, tracking: 0}
  bodySmall:      {font: text,    size: 13, weight: 400, height: 1.45, tracking: 0}
  labelLarge:     {font: text,    size: 15, weight: 700, height: 1.25, tracking: 0}
  labelMedium:    {font: text,    size: 13, weight: 600, height: 1.3,  tracking: 0.02}
  labelSmall:     {font: text,    size: 12, weight: 700, height: 1.3,  tracking: 0.06}
