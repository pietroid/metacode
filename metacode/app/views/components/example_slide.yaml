# Examples: a carousel of four working mini apps. Each slide embeds a
# sub-app from apps/ (food, music, work, plants) with `app:`.
ExampleSlide:
  responsive:
    breakpoint: 860
    narrow:
      column:
        crossAxisAlignment: stretch
        spacing: 32
        children:
        - ExampleCopy
        - ExamplePhone
    wide:
      row:
        crossAxisAlignment: center
        spacing: 64
        children:
        - expanded: ExampleCopy
        - sizedBox:
            width: 400
            child: ExamplePhone
